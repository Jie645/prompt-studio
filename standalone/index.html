<style id="pwFixes">
/* ============================================================
   整改层：叠加在构建产物之上，集中放本轮修复，便于回溯
   1. 功能面板：脱离输入框文档流，浮在其上方，吃满可用高度并可滚动
   2. 触控目标 / 键盘可达性
   3. 轻提示（toast）
   4. 最近生成 / 模型行操作 / 评分拆解
   ============================================================ */

/* ---- 1. 面板 ---- */
.composer{overflow:visible}
.panel{
  position:absolute; left:0; right:0; bottom:calc(100% + 10px);
  margin:0; z-index:45;
  background:var(--glass2); border:1px solid var(--line3); border-radius:var(--r20);
  box-shadow:0 34px 80px -30px #000000e6, inset 0 1px 0 #ffffff0f;
}
.panel::after{
  content:""; position:absolute; left:1px; right:1px; bottom:1px; height:30px;
  border-radius:0 0 var(--r20) var(--r20);
  background:linear-gradient(transparent,#0f1726 72%);
  pointer-events:none; opacity:0; transition:opacity .18s var(--ease);
}
.panel.scrollable::after{opacity:1}
.panelInner{max-height:var(--panelMax,calc(100dvh - 300px))}
.panelBody{
  max-height:var(--panelMax,calc(100dvh - 300px));
  border-bottom:0; padding:12px 16px 16px;
  overflow-y:auto; overscroll-behavior:contain;
  scrollbar-width:thin; scrollbar-color:#96b4ff73 transparent;
}
.panelBody::-webkit-scrollbar{width:8px;height:8px}
.panelBody::-webkit-scrollbar-thumb{
  background:#96b4ff52; border-radius:8px; border:2px solid transparent; background-clip:padding-box;
}
.panelBody::-webkit-scrollbar-thumb:hover{background:#96b4ff8c; background-clip:padding-box}
.panel:not(.open){visibility:hidden;pointer-events:none;transition:visibility 0s linear .26s}
.panel.open{visibility:visible;transition:visibility 0s linear 0s}

/* ---- 2. 可达性 ---- */
@media (max-width:720px){
  /* 触控目标统一到 44px，避免移动端误触 */
  .cap{height:auto;min-height:44px;padding:0 14px;font-size:12.5px}
  .menuBtn{height:auto;min-height:44px;padding:0 14px;font-size:12px}
  .seg button,.seg.small button{height:44px;padding:0 14px}
  .feat{height:auto;min-height:44px;padding:0 14px}
  .modelToggle,.menuToggle{min-height:44px}
  .modelChoice{min-height:52px;padding:11px 12px}
  .iconBtn{width:44px;height:44px}
  .btn{height:44px;padding:0 16px}
  .miniBtn{width:44px;height:44px;font-size:12px}
  .send{height:44px}
  .modelAdd{min-height:44px;padding:0 12px}
  .freeHint{display:none}
  /* 底部操作改为换行，避免最后一个按钮被横向滚出可视区 */
  .sheetFoot{flex-wrap:wrap;overflow:visible;row-gap:8px;gap:8px}
}
@media (max-width:360px){
  .topbar{padding:0 10px;gap:6px}
  .brand{gap:6px;min-width:0}
  .brandSub{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
  .topActions{gap:4px;min-width:0}
  .modelAdd{padding:0 8px;font-size:10.5px}
  .status{padding:0 8px;font-size:10px;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .compTop{gap:6px}
  .modelTag{max-width:122px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px}
  .seg.small button{padding:0 10px;font-size:11px;white-space:nowrap}
  .band{flex-wrap:wrap;overflow:visible;row-gap:6px}
  .cap{flex:0 0 auto}
}
@media (hover:none){ .freeHint{display:none} }

/* ---- 4. 沟通轮次与结果信息 ---- */
.qProg{display:flex;gap:5px;margin:0 0 12px}
.qProg i{height:3px;flex:1;border-radius:999px;background:#96b4ff26}
.qProg i.done{background:#3fe0b080}
.qProg i.on{background:linear-gradient(90deg,var(--cy),var(--pu))}
.qWhy{color:var(--ink3);border-left:2px solid #4dd8e83d;margin:9px 0 0;padding-left:9px;font-size:11.5px;line-height:1.7}
.qHint{color:var(--ink3);margin:10px 0 0;font-size:11.5px;font-variant-numeric:tabular-nums;line-height:1.6}
.optGrid.dense .opt{padding:10px 12px}
.opt[aria-pressed="true"]{background:#4dd8e81a;border-color:#4dd8e8b3}
.opt[aria-pressed="true"] b{color:var(--cy)}
.ansRow{flex-wrap:wrap;gap:6px;margin:12px 0 0;display:flex}
.ansChip{border-radius:var(--r999);border:1px solid var(--line2);background:#96b4ff14;max-width:100%;color:var(--ink2);white-space:nowrap;align-items:center;gap:6px;padding:3px 9px;font-size:11px;line-height:1.5;display:inline-flex;overflow:hidden}
.ansChip b{color:var(--cy);flex:none;font-weight:500}
.resSpeed{color:var(--ink3);margin-left:10px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px}
.genEsc{color:var(--ink3);opacity:.72;font-size:11px}
.skipRest{background:none;border:0;color:var(--ink3);text-align:left;padding:6px 0;font-size:11.5px;text-decoration:underline;text-underline-offset:3px}
.skipRest:hover{color:var(--cy)}
@media (max-width:720px){
  .optGrid.dense{grid-template-columns:1fr}
  .ansChip{font-size:10.5px}
}
.panelBody button:focus-visible,.histMain:focus-visible,.miniBtn:focus-visible{box-shadow:var(--ring)}

/* ---- 3. toast ---- */
.pwToast{
  position:fixed; left:50%; top:64px; z-index:120;
  transform:translate(-50%,-8px); opacity:0; pointer-events:none;
  max-width:min(520px,calc(100vw - 28px));
  padding:10px 14px; border-radius:12px;
  background:#162034f2; backdrop-filter:blur(14px);
  border:1px solid var(--line3); color:var(--ink);
  font-size:12.5px; line-height:1.55;
  box-shadow:0 18px 40px -20px #000000cc;
  transition:opacity .2s var(--ease), transform .24s var(--ease);
}
.pwToast.on{opacity:1; transform:translate(-50%,0)}
.pwToast.warn{color:var(--warn); border-color:#f0b64a59; background:#2a2316f2}
.pwToast.err{color:var(--err); border-color:#ff5b6e59; background:#2a161af2}
.pwToast.ok{color:var(--ok); border-color:#3fe0b059; background:#0f2a24f2}

/* ---- 4. 最近生成 ---- */
.histList{display:grid;gap:6px}
.histItem{display:flex;gap:6px;align-items:stretch}
.histMain{
  flex:1 1 auto; min-width:0; text-align:left;
  border-radius:var(--r10); border:1px solid var(--line2); background:var(--slot);
  padding:9px 11px; display:flex; flex-direction:column; gap:3px;
  transition:border-color .16s var(--ease), background .16s var(--ease);
}
.histMain:hover{border-color:var(--line3); background:var(--glass)}
.histMain b{
  color:var(--ink); font-size:12.5px; font-weight:500; line-height:1.45;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.histMain small{color:var(--ink3); font-size:11px; font-family:var(--mono)}
.histMain.used b::after{content:" · 已采用"; color:var(--ok); font-size:10.5px}
.histTools{display:flex;flex-direction:column;gap:6px;flex:none}
.miniBtn{
  width:32px; height:32px; border-radius:9px; flex:none;
  border:1px solid var(--line2); background:var(--slot); color:var(--ink3);
  display:inline-flex; align-items:center; justify-content:center; font-size:12px;
  transition:color .16s var(--ease), border-color .16s var(--ease), background .16s var(--ease);
}
.miniBtn:hover{color:var(--ink); border-color:var(--line3); background:var(--glass)}
.miniBtn.danger:hover{color:var(--err); border-color:#ff5b6e66}
.miniBtn.confirm{
  width:auto; padding:0 8px; color:var(--err);
  border-color:#ff5b6e8c; background:#ff5b6e17; font-size:11px;
}
.histEmpty{color:var(--ink3); font-size:11.5px; line-height:1.7; margin:0}

/* ---- 5. 模型行操作 ---- */
.modelRow{display:flex; gap:6px; align-items:stretch}
.modelRow .modelChoice{flex:1 1 auto; min-width:0}
.modelRow .modelTools{display:flex; gap:4px; flex:none; align-items:center}

/* ---- 6. 评分拆解 ---- */
.dims{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px}
.dim{border:1px solid var(--line); background:var(--slot); border-radius:10px; padding:8px 10px 9px}
.dim b{display:block; font-size:11px; font-weight:500; color:var(--ink3); letter-spacing:.2px}
.dim i{font-style:normal; font-family:var(--mono); font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums}
.dim i u{text-decoration:none; color:var(--ink3); font-size:10.5px}
.dimBar{height:3px; border-radius:3px; background:#96b4ff1f; margin-top:6px; overflow:hidden}
.dimBar span{display:block; height:100%; border-radius:3px; background:linear-gradient(90deg,var(--cy),var(--pu)); transform-origin:left; transition:transform .5s var(--ease)}
.dimNote{font-size:11px; color:var(--ink3); line-height:1.6; margin:10px 0 0}
.dimNote b{color:var(--ink2); font-weight:500}
@media (max-width:720px){
  .dims{grid-template-columns:repeat(2,1fr)}
}

/* ---- 7. 矮屏（<=940px 高）再压一档，尽量一屏看全 ---- */
@media (max-height:940px) and (min-width:721px){
  .panelBody{padding:10px 16px 12px}
  .panelBody .menuGroup{padding:8px 0}
  .panelBody .menuTitle{margin-bottom:6px}
  .panelBody .menuNote{font-size:11px;line-height:1.5}
  .feat{height:28px}
  .menuBtn{height:28px}
  .menuToggle{padding:6px 10px}
  .modelChoice{padding:8px 10px}
}

/* ---- 8. 历史条目标题不被裁切 ---- */
.menuTitle span{flex:none}
/* 收紧一点纵向间距，让 900px 高的屏幕一次看全，不必先滚动 */
.panelHead{margin-bottom:8px}
.panelBody .menuGroup{padding:9px 0}
.panelBody .menuTitle{margin-bottom:8px}
.panelBody .menuNote{line-height:1.55}
.seg button[aria-disabled="true"]{opacity:.62}
.seg button[aria-disabled="true"]:hover{color:var(--ink3)}
.optGrid.need .opt{border-color:#f0b64a8c;background:#f0b64a10}
</style>
<style id="pwOrbit">
/* ===== 轨道：待机时什么都不画，生成时只剩一道进度弧 ===== */
.orbitLayer{position:fixed;inset:0;z-index:6;pointer-events:none}
.orbitSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbitProg{opacity:0;transition:opacity .36s var(--ease)}
.orbitProg.on{opacity:1}
.orbitProg path{fill:none;stroke:var(--cy);stroke-width:2.4;stroke-linecap:round;
  stroke-dasharray:100;stroke-dashoffset:100}
.orbitLayer .genLabel{top:auto;left:0;transform:translateX(-50%);
  text-shadow:0 1px 10px #05070c,0 0 3px #05070c}
.orbCancel{position:fixed;z-index:7;transform:translateX(-50%);height:32px;padding:0 14px;
  border-radius:var(--r999);border:1px solid var(--line2);background:#121a2ccc;color:var(--ink3);
  font:inherit;font-size:11.5px;letter-spacing:.3px;cursor:pointer;animation:pwOrbIn .3s var(--ease) both}
.orbCancel:hover{color:var(--ink);border-color:#4dd8e88c}
.orbCancel:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.orbCancel[hidden]{display:none}
@keyframes pwOrbIn{from{opacity:0;transform:translateX(-50%) translateY(4px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* 公转期去掉 drop-shadow：每帧 filter 会拖帧 */
.ball.orbiting{filter:none}
@media (max-width:720px){
  .orbitLayer .genLabel{font-size:11.5px}
  .orbCancel{height:44px;font-size:12.5px}
}
</style>
<style id="pwDeep">
/* ===== 深度模式开关：旋钮要真的动 ===== */
.menuToggle{transition:color .16s var(--ease),border-color .16s var(--ease),background .16s var(--ease)}
.menuToggle:hover{border-color:var(--line3);color:var(--ink)}
.menuToggle.on{border-color:#4dd8e88c;background:#4dd8e80f}
.menuToggle.on .sw{background:#4dd8e87d}
.menuToggle.on .sw:after{background:#eafbff;transform:translate(11px)}
.menuToggle small{white-space:nowrap}
.menuToggle.on small{color:#8fe9f4}
@media (max-width:720px){
  .menuToggle small{white-space:normal;text-align:right;line-height:1.35}
}
</style>
<style id="pwModelSetup">
.mAdvanced{border:1px solid var(--line);border-radius:var(--r10);padding:0 12px;background:#96b4ff08}
.mAdvanced summary{cursor:pointer;color:var(--ink3);font-size:11.5px;line-height:40px;list-style:none}
.mAdvanced summary::-webkit-details-marker{display:none}
.mAdvanced summary:after{content:"＋";float:right;color:var(--cy)}
.mAdvanced[open] summary:after{content:"－"}
.mAdvanced .mField{margin:0 0 12px}
.mTestNote{min-height:18px;margin:0;font-size:11.5px;line-height:1.6;color:var(--ink3)}
</style>
</head>
<body>

<h1 class="sr">轨道算术 · 提示词工作台</h1>

<div id="vortex-root" class="vortex-bg" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 14 14" width="13" height="13" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5.4" stroke="currentColor" stroke-width="1.5"/>
        <path d="M1.6 7h10.8M7 1.6v10.8" stroke="currentColor" stroke-width="1.1"/>
      </svg>
    </span>
    <span class="divv" aria-hidden="true"></span>
    <span class="brandSub">提示词工作台</span>
  </div>
  <div class="topActions">
    <button class="modelAdd" id="addModel" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 12 12" width="11" height="11" fill="none" aria-hidden="true">
        <path d="M6 2v8M2 6h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span>添加模型</span>
    </button>
    <div class="status off" id="statusPill" role="status"
         title="当前使用内置离线规则生成，不会上传你的输入">
      <i aria-hidden="true"></i><span id="statusTxt">离线规则模式</span>
    </div>
  </div>
</header>

<main class="stage" id="stage"></main>

<!-- 轨道层：坐标系与视口一致（星球在 #fly 里，飞和转用的是同一套坐标） -->
<div class="orbitLayer" id="orbitLayer" aria-hidden="true">
  <svg class="orbitSvg" id="orbitSvg" aria-hidden="true">
    <g class="orbitProg" id="prog">
      <path id="progBar" pathLength="100" d=""/>
    </g>
  </svg>
  <p class="genLabel" id="genLabel"></p>
</div>
<button class="orbCancel" id="orbitCancel" type="button" hidden>取消生成</button>

<!-- 输入框卡：待机态唯一在场的东西；回车后隐去（占位保留） -->
<section class="composer" id="composer">
  <div class="panel" id="panel">
    <div class="panelInner"><div class="panelBody" id="panelBody"></div></div>
  </div>

  <div class="compTop">
    <span class="modelTag" id="modelTag">当前：长文写作模型</span>
    <div class="seg small" id="modeSeg" role="group" aria-label="生成模式">
      <button type="button" data-v="单模型" class="on" aria-pressed="true">单模型</button>
      <button type="button" data-v="多模型对比" aria-pressed="false">多模型对比</button>
    </div>
  </div>

  <textarea id="promptInput" rows="3" placeholder="说一句你想要什么，回车发射。例如：给我一份能直接实现的登录页交互提示词"
            aria-label="需求输入"></textarea>

  <div class="band" id="band">
    <button class="cap accent" type="button" data-cap="feats"
            aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 12 12" width="11" height="11" fill="none" aria-hidden="true">
        <path d="M6 2v8M2 6h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span>功能</span><span class="num" id="featNum" hidden>0</span>
    </button>
    <button class="cap" type="button" data-cap="history"
            aria-expanded="false" aria-controls="panel">
      <span>最近</span><span class="num" id="histNum" hidden>0</span>
    </button>
    <button class="cap" type="button" data-cap="model"
            aria-expanded="false" aria-controls="panel">
      <span>生成模型 · <b id="capModel">离线规则</b></span>
      <svg class="car" viewBox="0 0 10 6" width="9" height="6" fill="none" aria-hidden="true">
        <path d="M1 1.5L5 5l4-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="compBottom">
    <div class="right">
      <span class="count" id="count">0 字</span>
      <button class="send" id="send" type="button" disabled>
        <span>发射</span>
        <svg viewBox="0 0 14 14" width="13" height="13" fill="none" aria-hidden="true">
          <path d="M7 11.4V2.6M3 6.6L7 2.6l4 4" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</section>

<div class="fly" id="fly" aria-hidden="true"></div>
<div class="fx" id="fx" aria-hidden="true"></div>
<div class="scrim" id="scrim"></div>
<p class="sr" id="live" role="status" aria-live="polite" aria-atomic="true"></p>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"
       tabindex="-1" hidden>
    <header class="sheetHead">
      <div class="headL">
        <span class="pulse" aria-hidden="true"></span>
        <h2 class="sheetTitle" id="sheetTitle">沟通 · 第 1 轮</h2>
      </div>
      <div class="headR">
        <span class="headBadge" id="sheetBadge" hidden></span>
        <span class="sheetMeta" id="sheetMeta"></span>
        <button class="iconBtn" id="sheetClose" type="button" aria-label="关闭">✕</button>
      </div>
    </header>
    <div class="sheetBody" id="sheetBody"></div>
    <footer class="sheetFoot" id="sheetFoot"></footer>
  </div>
</div>

<script>
(function () {
  "use strict";

  var TAP_MS = 90, FLY_MS = 460, HIT_MS = 220, FADE_MS = 160, REDUCED_MS = 60, DT_MAX = 48;
  var TRAIL_LIFE = 380, TRAIL_EVERY = 24, TRAIL_TILL = 0.68;
  var N_GHOST = 3, N_DOT = 12, N_RING = 2, N_SPARK = 5;
  var GHOST_LAG = [0.055, 0.105, 0.16];
  var GHOST_ALPHA = [0.26, 0.15, 0.07];
  var CIRC = 100;                 // 进度弧归一化周长（pathLength=100，省掉 getTotalLength）

  var el = function (id) { return document.getElementById(id); };
  var stage = el("stage");
  var orbitSvg = el("orbitSvg");
  var orbitCancel = el("orbitCancel");
  var composer = el("composer"), input = el("promptInput"), sendBtn = el("send");
  var band = el("band"), panel = el("panel"), panelBody = el("panelBody");
  var featNum = el("featNum"), capModel = el("capModel"), count = el("count");
  var modelTag = el("modelTag"), modeSeg = el("modeSeg");
  var prog = el("prog"), progBar = el("progBar"), genLabel = el("genLabel");
  var fly = el("fly"), fxLayer = el("fx"), scrim = el("scrim"), overlay = el("overlay");
  var sheet = el("sheet"), sheetTitle = el("sheetTitle"), sheetMeta = el("sheetMeta");
  var sheetBadge = el("sheetBadge");
  var sheetBody = el("sheetBody"), sheetFoot = el("sheetFoot"), sheetClose = el("sheetClose");
  var statusPill = el("statusPill"), statusTxt = el("statusTxt");
  var live = el("live");
  var topbar = document.querySelector(".topbar");
  var addModelBtn = el("addModel");
  var histNum = el("histNum");
  /* 由安装包里的 server.mjs 在 8787 端口提供同源转发；直接打开 file:// 时为 false */
  var LOCAL_PROXY = location.protocol === "http:" &&
    (location.hostname === "127.0.0.1" || location.hostname === "localhost") &&
    location.port === "8787";

  progBar.style.strokeDasharray = String(CIRC);
  progBar.style.strokeDashoffset = String(CIRC);

  var RMQ = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  function reducedMotion() { return !!(RMQ && RMQ.matches); }

  /* ================= 状态 ================= */
  var ST_IDLE = "idle", ST_FLY = "flying", ST_ASK = "ask",
      ST_GEN = "generating", ST_RESULT = "result";
  var state = ST_IDLE;
  var sheetGen = 0, sheetOpenedAt = 0, sheetKind = "";
  var panelOpen = null;

  var SET = {
    detail: "标准",           // 精简 | 标准 | 详尽
    flow: "先沟通再生成",      // 直接生成 | 先沟通再生成
    deep: false,
    timeout: 60,             // 秒：模型响应上限，超时自动回退离线规则
    model: "离线规则",
    profileKey: "offline",
    mode: "单模型",
    feats: {}
  };

  /* 生成设置持久化：刷新后不必重新选一遍 */
  (function loadSettings() {
    var raw = null;
    try { raw = localStorage.getItem("pw-settings"); } catch (e) { return; }
    if (!raw) return;
    var o = null;
    try { o = JSON.parse(raw); } catch (e) { return; }
    if (!o || typeof o !== "object") return;
    if (["精简", "标准", "详尽"].indexOf(o.detail) >= 0) SET.detail = o.detail;
    if (["直接生成", "先沟通再生成"].indexOf(o.flow) >= 0) SET.flow = o.flow;
    if (typeof o.deep === "boolean") SET.deep = o.deep;
    if ([30, 60, 120].indexOf(Number(o.timeout)) >= 0) SET.timeout = Number(o.timeout);
    if (o.feats && typeof o.feats === "object") {
      Object.keys(o.feats).forEach(function (k) {
        if (o.feats[k] === true) SET.feats[k] = true;
      });
    }
  })();
  function saveSettings() {
    try {
      localStorage.setItem("pw-settings", JSON.stringify({
        detail: SET.detail, flow: SET.flow, deep: SET.deep,
        timeout: SET.timeout, feats: SET.feats
      }));
    } catch (e) {}
  }

  var FEATURES = [
    { id: "role",   name: "角色设定" },
    { id: "example",name: "输出示例" },
    { id: "forbid", name: "边界与禁区" },
    { id: "accept", name: "验收标准" },
    { id: "cot",    name: "分步推理" },
    { id: "cite",   name: "引用要求" }
  ];

  var OFFLINE_PROFILE = {
    key: "offline",
    id: "offline",
    source: "offline",
    name: "离线规则",
    modelId: "local-rule-engine",
    baseUrl: "",
    protocol: "offline",
    apiKey: ""
  };
  var customModels = loadCustomModels();
  var serverProfiles = [];
  var serverAvailable = false;

  function loadCustomModels() {
    try {
      var list = JSON.parse(localStorage.getItem("pw-custom-models") || "[]");
      return Array.isArray(list)
        ? list.filter(function (m) { return m && m.name && m.modelId; }).map(function (m, i) {
            var id = m.id || "local-" + i;
            return {
              key: "local:" + id,
              id: id,
              source: "local",
              name: m.name,
              modelId: m.modelId,
              baseUrl: m.baseUrl || "",
              protocol: m.protocol || "openai",
              apiKey: m.apiKey || ""
            };
          })
        : [];
    } catch (e) {
      return [];
    }
  }

  function saveCustomModels() {
    try {
      localStorage.setItem("pw-custom-models", JSON.stringify(customModels.map(function (m) {
        return {
          id: m.id,
          name: m.name,
          modelId: m.modelId,
          baseUrl: m.baseUrl,
          protocol: m.protocol,
          apiKey: m.apiKey || ""
        };
      })));
    } catch (e) {}
  }

  /* ================= 轻提示 ================= */
  var toastEl = null, toastTimer = 0;
  function toast(msg, kind) {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.className = "pwToast";
      toastEl.setAttribute("role", "status");
      toastEl.setAttribute("aria-live", "polite");
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.className = "pwToast on" + (kind ? " " + kind : "");
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      toastEl.className = "pwToast" + (kind ? " " + kind : "");
    }, 3600);
    if (live) live.textContent = msg;
  }

  /* ================= 最近生成（本机历史，最多 12 条） ================= */
  var HIST_KEY = "pw-history", HIST_MAX = 12;
  function loadHistory() {
    try {
      var list = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
      return Array.isArray(list) ? list.filter(function (x) { return x && x.prompt && x.id; }) : [];
    } catch (e) { return []; }
  }
  var history = loadHistory();

  function persistHistory() {
    try { localStorage.setItem(HIST_KEY, JSON.stringify(history.slice(0, HIST_MAX))); } catch (e) {}
    renderHistoryBadge();
  }
  function renderHistoryBadge() {
    if (!histNum) return;
    histNum.hidden = history.length === 0;
    histNum.textContent = String(history.length);
  }
  function addHistory(entry) {
    var body = String(entry.prompt || "");
    var dup = null;
    history.forEach(function (x) { if (x.prompt === body) dup = x; });
    if (dup) {
      dup.ts = Date.now();
      dup.brief = entry.brief || dup.brief;
      dup.score = entry.score || dup.score;
      history = [dup].concat(history.filter(function (x) { return x !== dup; }));
      persistHistory();
      return dup.id;
    }
    var item = {
      id: "h-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 900 + 100),
      ts: Date.now(),
      brief: entry.brief || "",
      prompt: entry.prompt || "",
      score: entry.score || 0,
      engine: entry.engine || "离线规则",
      used: false
    };
    history.unshift(item);
    history = history.slice(0, HIST_MAX);
    persistHistory();
    return item.id;
  }
  function findHistory(id) {
    for (var i = 0; i < history.length; i++) if (history[i].id === id) return history[i];
    return null;
  }
  function removeHistory(id) {
    history = history.filter(function (x) { return x.id !== id; });
    persistHistory();
    if (panelOpen === "history") { panelBody.innerHTML = panelHTML("history"); fitPanel(); }
    toast("已删除这条记录");
  }
  function markUsed(id) {
    history.forEach(function (x) { if (x.id === id) x.used = true; });
    persistHistory();
  }
  function agoText(ts) {
    var d = Math.max(0, Date.now() - ts) / 1000;
    if (d < 60) return "刚刚";
    if (d < 3600) return Math.floor(d / 60) + " 分钟前";
    if (d < 86400) return Math.floor(d / 3600) + " 小时前";
    return Math.floor(d / 86400) + " 天前";
  }
  function historyItemHTML(item, i) {
    var title = (item.brief || "未命名需求").replace(/\s+/g, " ").slice(0, 60);
    return '<div class="histItem">' +
      '<button class="histMain' + (item.used ? " used" : "") + '" type="button" data-hist-open="' + esc(item.id) +
      '" aria-label="打开记录：' + esc(title) + '">' +
        "<b>" + esc(title) + "</b>" +
        "<small>" + agoText(item.ts) + " · " + item.score + " 分 · " + fmtNum(item.prompt.length) + " 字</small>" +
      "</button>" +
      '<div class="histTools">' +
        '<button class="miniBtn" type="button" data-hist-copy="' + esc(item.id) + '" title="复制内容" aria-label="复制这条提示词">⧉</button>' +
        '<button class="miniBtn danger" type="button" data-hist-del="' + esc(item.id) + '" title="删除" aria-label="删除这条记录">✕</button>' +
      "</div>" +
    "</div>";
  }

  function allModelProfiles() {
    return [OFFLINE_PROFILE].concat(customModels, serverProfiles);
  }

  function profileByKey(key) {
    return allModelProfiles().find(function (p) { return p.key === key; }) || OFFLINE_PROFILE;
  }

  function selectedProfile() {
    return profileByKey(SET.profileKey);
  }

  /* 真正能发起调用的模型：本地服务里的，或填了 Key 的本地模型 */
  function usableProfiles() {
    return allModelProfiles().filter(function (p) {
      if (p.source === "offline") return false;
      if (p.source === "server") return true;
      return !!p.apiKey || isLocalEndpoint(p.baseUrl);
    });
  }

  function setSelectedProfile(key, persist) {
    var profile = profileByKey(key);
    SET.profileKey = profile.key;
    SET.model = profile.name;
    if (profile.source !== "offline") {
      SET.mode = "单模型";
      Array.prototype.forEach.call(modeSeg.children, function (b) {
        var on = b.dataset.v === "单模型";
        b.classList.toggle("on", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }
    if (persist !== false) {
      try { localStorage.setItem("pw-selected-profile", profile.key); } catch (e) {}
    }
    refreshCaps();
    updateModeStatus();
  }

  function updateModeStatus() {
    var profile = selectedProfile();
    if (profile.source === "offline") {
      statusPill.classList.add("off");
      statusPill.classList.remove("mode");
      statusPill.title = "当前使用内置离线规则生成，不会上传你的输入";
      statusTxt.textContent = "离线规则模式";
    } else {
      statusPill.classList.remove("off");
      statusPill.classList.add("mode");
      statusPill.title = "已选择生成模型：" + profile.name + "（" + profile.modelId + "）";
      statusTxt.textContent = "模型生成";
    }
  }

  var PROVIDER_PRESETS = {
    custom: { name: "自定义接口", protocol: "openai", baseUrl: "", model: "" },
    openai: {
      name: "OpenAI", protocol: "openai",
      baseUrl: "https://api.openai.com/v1", model: "gpt-4.1-mini"
    },
    deepseek: {
      name: "DeepSeek", protocol: "openai",
      baseUrl: "https://api.deepseek.com/v1", model: "deepseek-chat"
    },
    alibaba: {
      name: "阿里云百炼", protocol: "openai",
      baseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1", model: "qwen-plus"
    },
    moonshot: {
      name: "月之暗面 Kimi", protocol: "openai",
      baseUrl: "https://api.moonshot.cn/v1", model: "moonshot-v1-8k"
    },
    zhipu: {
      name: "智谱 GLM", protocol: "openai",
      baseUrl: "https://open.bigmodel.cn/api/paas/v4", model: "glm-4-flash"
    },
    anthropic: {
      name: "Anthropic", protocol: "anthropic",
      baseUrl: "https://api.anthropic.com/v1", model: "claude-sonnet-4-5"
    },
    ollama: {
      name: "Ollama 本地", protocol: "openai",
      baseUrl: "http://127.0.0.1:11434/v1", model: "qwen2.5:7b"
    }
  };

  function normalizeBaseUrl(raw) {
    var value = String(raw || "").trim().replace(/#.*$/, "");
    if (!value) return "";
    try {
      var u = new URL(value);
      var path = u.pathname.replace(/\/+$/, "");
      /* 阿里云兼容模式常见漏写 /v1；补上后仍然可被 apiEndpoint 识别。 */
      if (u.hostname === "dashscope.aliyuncs.com" && path === "/compatible-mode") path += "/v1";
      if (!path) path = "/v1";
      return u.origin + path;
    } catch (e) {
      return value.replace(/\/+$/, "");
    }
  }

  function apiKind(profile) {
    var base = String(profile && profile.baseUrl || "");
    if ((profile && profile.protocol) === "anthropic" || /\/messages\/?$/.test(base)) return "anthropic";
    if (/\/responses\/?$/.test(base)) return "responses";
    return "openai";
  }

  function apiEndpoint(profile, path) {
    var base = normalizeBaseUrl(profile.baseUrl);
    if (/\/(chat\/completions|responses|messages)\/?$/.test(base)) return base.replace(/\/+$/, "");
    return base + path;
  }

  function isLocalEndpoint(baseUrl) {
    try {
      var host = new URL(baseUrl).hostname;
      return host === "localhost" || host === "127.0.0.1" || host === "::1";
    } catch (e) {
      return false;
    }
  }

  /* ================= 网络策略：慢模型也要能用 =================
     分阶段看门狗：等连接 → 等首字 → 等下一段；任何一段卡住就立刻止损，
     已经收到的内容不丢，直接当「截断稿」交付，用户可以马上拿去用。 */
  var NET = {
    connect: 12000,    // 建立连接（拿到响应头）的上限
    first: 25000,      // 等第一个字的上限
    idle: 18000,       // 两个字之间允许的最大空档
    hardCap: 300000    // 绝对上限，兜底
  };
  function timeoutMs() {
    var sec = Number(SET.timeout);
    if (!sec || sec < 15) sec = 60;
    return Math.min(Math.max(sec, 20), 300) * 1000;
  }
  /* 一次调用的体检数据：首字延迟 / 总耗时 / 收到多少字 / 是否被截断 */
  var lastCall = { firstMs: 0, totalMs: 0, chars: 0, truncated: false, reason: "", streaming: false };
  var activeCall = null;      // 正在进行的请求，可随时取消
  var streamChars = 0, streamFirst = 0;
  var streamActive = false;   // 已经开始收到流式内容：动画阶段就不再抢标签

  function resetCallMeta() {
    lastCall = { firstMs: 0, totalMs: 0, chars: 0, truncated: false, reason: "", streaming: false };
    streamChars = 0; streamFirst = 0; streamActive = false;
  }
  function abortActiveCall(reason) {
    var call = activeCall;
    activeCall = null;
    if (call && call.abort) { try { call.abort(reason); } catch (e) {} }
  }
  /* 输出预算：写得越短越快，按详细程度给 token 上限，别让模型自由发挥到 4096 */
  function budgetOf(explicit) {
    if (explicit) return explicit;
    var base = SET.detail === "精简" ? 900 : SET.detail === "详尽" ? 2600 : 1600;
    if (SET.deep) base += 700;
    return base;
  }

  function modelHeaders(profile, stream) {
    var headers = {
      "content-type": "application/json",
      accept: stream ? "text/event-stream" : "application/json"
    };
    if (profile.protocol === "anthropic") {
      headers["x-api-key"] = profile.apiKey || "";
      headers["anthropic-version"] = "2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"] = "true";
    } else if (profile.apiKey) {
      headers.authorization = "Bearer " + profile.apiKey;
    }
    return headers;
  }

  function modelBody(profile, system, user, opts) {
    opts = opts || {};
    var stream = !!opts.stream;
    var budget = Math.max(256, Math.min(4096, opts.maxTokens || 1600));
    if (apiKind(profile) === "anthropic") {
      return {
        model: profile.modelId,
        system: system,
        messages: [{ role: "user", content: user }],
        max_tokens: budget,
        temperature: 0.4,
        stream: stream
      };
    }
    if (apiKind(profile) === "responses") {
      return {
        model: profile.modelId,
        instructions: system,
        input: user,
        max_output_tokens: budget,
        temperature: 0.4,
        stream: stream
      };
    }
    return {
      model: profile.modelId,
      messages: [
        { role: "system", content: system },
        { role: "user", content: user }
      ],
      temperature: 0.4,
      max_tokens: budget,
      stream: stream
    };
  }

  /* 从流式事件里抠出这一小段增量：OpenAI 与 Anthropic 的字段不一样 */
  function sseDelta(profile, obj) {
    if (!obj) return "";
    if (apiKind(profile) === "anthropic") {
      if (obj.type === "content_block_delta" && obj.delta) return obj.delta.text || "";
      return "";
    }
    if (apiKind(profile) === "responses") {
      if (obj.type === "response.output_text.delta" && typeof obj.delta === "string") return obj.delta;
      if (obj.type === "response.output_text.done" && typeof obj.text === "string") return "";
      return "";
    }
    var c = obj.choices && obj.choices[0];
    if (!c) return typeof obj.output_text === "string" ? obj.output_text : "";
    if (c.delta && typeof c.delta.content === "string") return c.delta.content;
    if (c.message && typeof c.message.content === "string") return c.message.content;
    return c.text || "";
  }

  function modelText(profile, json, raw) {
    if (apiKind(profile) === "anthropic") {
      var chunks = (json && json.content) || [];
      return chunks.map(function (c) { return c.text || ""; }).join("");
    }
    if (apiKind(profile) === "responses") {
      if (json && typeof json.output_text === "string") return json.output_text;
      if (json && Array.isArray(json.output)) {
        return json.output.map(function (item) {
          return (item.content || []).map(function (part) {
            return part.text || "";
          }).join("");
        }).join("");
      }
      return raw || "";
    }
    var choice = json && json.choices && json.choices[0];
    if (choice) return (choice.message && choice.message.content) || choice.text || "";
    if (json && typeof json.output_text === "string") return json.output_text;
    return raw || "";
  }

  async function readApiError(resp) {
    var text = "";
    try { text = await resp.text(); } catch (e) {}
    var detail = text;
    try {
      var json = JSON.parse(text);
      detail = (json.error && (json.error.message || json.error)) || json.message || text;
    } catch (e) {}
    return String(detail || ("HTTP " + resp.status)).slice(0, 360);
  }

  async function callModelProfile(profile, system, user, opts) {
    opts = opts || {};
    resetCallMeta();
    var startedAt = performance.now();

    if (profile.source === "offline") throw new Error("当前是离线规则模式。");

    if (profile.source === "server") {
      var rctrl = new AbortController();
      var rtimer = window.setTimeout(function () { rctrl.abort(); }, timeoutMs());
      activeCall = { abort: function (reason) { rctrl.abort(); } };
      try {
        var relay = await fetch("/api/relay/" + encodeURIComponent(profile.id), {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ system: system, user: user, stream: false, json: false }),
          signal: rctrl.signal
        });
        if (!relay.ok) throw new Error(await readApiError(relay));
        var relayText = await relay.text();
        var relayJson = null;
        try { relayJson = JSON.parse(relayText); } catch (e) {}
        var relayOut = modelText(profile, relayJson, relayText).trim();
        lastCall.totalMs = Math.round(performance.now() - startedAt);
        lastCall.chars = relayOut.length;
        return relayOut;
      } catch (err) {
        if (err && err.name === "AbortError") {
          throw new Error("本地服务 " + Math.round(timeoutMs() / 1000) + " 秒没有返回。");
        }
        throw err;
      } finally {
        window.clearTimeout(rtimer);
        activeCall = null;
      }
    }

    if (!profile.baseUrl) throw new Error("该模型没有填写接口地址。");
    if (!profile.modelId) throw new Error("该模型没有填写模型 ID。");
    if (!profile.apiKey && !isLocalEndpoint(profile.baseUrl)) {
      throw new Error("该模型没有保存 API Key。请重新添加模型并填写密钥。");
    }

    var capMs = Math.max(20000, Math.min(timeoutMs(), NET.hardCap));
    var ctrl = new AbortController();
    var partial = "";
    var stopReason = "";
    var firstAt = 0;
    var idleTimer = 0, hardTimer = 0, firstTimer = 0;

    activeCall = {
      abort: function (reason) { stopReason = reason || "已取消"; ctrl.abort(); }
    };

    function clearTimer(t) { if (t) window.clearTimeout(t); return 0; }
    function armIdle() {
      idleTimer = clearTimer(idleTimer);
      idleTimer = window.setTimeout(function () {
        stopReason = "生成中断：" + Math.round(NET.idle / 1000) + " 秒没有新内容";
        ctrl.abort();
      }, NET.idle);
    }

    try {
      var kind = apiKind(profile);
      var endpoint = apiEndpoint(
        profile,
        kind === "anthropic" ? "/messages" : kind === "responses" ? "/responses" : "/chat/completions"
      );
      firstTimer = window.setTimeout(function () {
        if (firstAt) return;
        stopReason = "首字超时：" + Math.round(Math.min(NET.first, capMs) / 1000) + " 秒没等到第一个字";
        ctrl.abort();
      }, Math.min(NET.first, capMs));
      hardTimer = window.setTimeout(function () {
        if (stopReason) return;
        stopReason = "整轮超时：超过 " + Math.round(capMs / 1000) + " 秒";
        ctrl.abort();
      }, capMs);

      var reqHeaders = modelHeaders(profile, true);
      var reqBody = modelBody(profile, system, user, {
        stream: true,
        maxTokens: opts.maxTokens
      });
      var resp;
      if (LOCAL_PROXY) {
        /* 本地启动器负责转发，规避浏览器对云端接口的 CORS 限制。 */
        resp = await fetch("/api/proxy", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ url: endpoint, headers: reqHeaders, body: reqBody }),
          signal: ctrl.signal
        });
      } else {
        resp = await fetch(endpoint, {
          method: "POST",
          headers: reqHeaders,
          body: JSON.stringify(reqBody),
          signal: ctrl.signal
        });
      }
      if (!resp.ok) throw new Error(await readApiError(resp));
      firstTimer = clearTimer(firstTimer);

      var ctype = (resp.headers.get("content-type") || "").toLowerCase();
      var canStream = ctype.indexOf("event-stream") >= 0 &&
                      resp.body && typeof resp.body.getReader === "function";

      /* 网关忽略 stream、直接返回整段 JSON：走这条，别死等流 */
      if (!canStream) {
        var raw = await resp.text();
        var json = null;
        try { json = JSON.parse(raw); } catch (e) {}
        var text = modelText(profile, json, raw).trim();
        if (!text) throw new Error("模型没有返回文本，可能被安全策略拦截。");
        lastCall.totalMs = Math.round(performance.now() - startedAt);
        lastCall.chars = text.length;
        return text;
      }

      lastCall.streaming = true;
      armIdle();
      var reader = resp.body.getReader();
      var dec = new TextDecoder("utf-8");
      var buf = "";
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += dec.decode(chunk.value, { stream: true });
        var lines = buf.split("\n");
        buf = lines.pop();
        for (var li = 0; li < lines.length; li++) {
          var line = lines[li].trim();
          if (!line || line.charAt(0) === ":" || line.indexOf("data:") !== 0) continue;
          var payload = line.slice(5).trim();
          if (!payload || payload === "[DONE]") continue;
          var obj = null;
          try { obj = JSON.parse(payload); } catch (e) { continue; }
          if (obj.error || obj.type === "error") {
            throw new Error((obj.error && (obj.error.message || obj.error)) || "接口在流中途返回错误");
          }
          var delta = sseDelta(profile, obj);
          if (!delta) continue;
          if (!firstAt) {
            firstAt = performance.now();
            lastCall.firstMs = Math.round(firstAt - startedAt);
            streamFirst = lastCall.firstMs;
            if (opts.onFirstToken) opts.onFirstToken(lastCall.firstMs);
          }
          partial += delta;
          streamChars = partial.length;
          lastCall.chars = partial.length;
          armIdle();
          if (opts.onProgress) opts.onProgress(partial.length, lastCall.firstMs);
        }
      }
      /* 收尾：最后一行可能没有换行符 */
      var tailLine = buf.trim();
      if (tailLine && tailLine.indexOf("data:") === 0) {
        var tailPayload = tailLine.slice(5).trim();
        if (tailPayload && tailPayload !== "[DONE]") {
          try {
            var tailDelta = sseDelta(profile, JSON.parse(tailPayload));
            if (tailDelta) partial += tailDelta;
          } catch (e) {}
        }
      }
      if (!partial.trim()) throw new Error("模型没有返回文本，可能被安全策略拦截。");
      lastCall.totalMs = Math.round(performance.now() - startedAt);
      lastCall.chars = partial.length;
      if (partial.length < 60 && !opts.allowShort) {
        throw new Error("模型只返回了 " + partial.length + " 个字符，内容不完整，已改用离线规则。");
      }
      return partial.trim();
    } catch (err) {
      var aborted = !!(err && (err.name === "AbortError" || ctrl.signal.aborted));
      var elapsed = Math.round(performance.now() - startedAt);
      lastCall.totalMs = elapsed;
      lastCall.chars = partial.length;
      /* 已经收到足够内容：不当失败，按「截断稿」交付 */
      if (partial.trim().length >= 180) {
        lastCall.truncated = true;
        lastCall.reason = stopReason || "流式响应提前结束";
        toast("模型没能在限定时间内写完，已保留已收到的 " + partial.length + " 字", "warn");
        return partial.trim();
      }
      if (aborted) {
        throw new Error(stopReason ||
          (elapsed >= capMs - 800
            ? "整轮超时：超过 " + Math.round(capMs / 1000) + " 秒没有写完"
            : "生成被中断"));
      }
      if (err instanceof TypeError) {
        throw new Error(LOCAL_PROXY
          ? "模型接口请求失败：地址不可达、证书异常，或本地代理未启动。"
          : "浏览器从本地文件直接请求云端接口会被 CORS 拦截。请关闭本页，使用桌面 Prompt Studio Standalone 快捷方式启动本地代理后再测试。");
      }
      throw err;
    } finally {
      idleTimer = clearTimer(idleTimer);
      hardTimer = clearTimer(hardTimer);
      firstTimer = clearTimer(firstTimer);
      activeCall = null;
    }
  }

  function buildModelRequest(brief, ans, st, profile) {
    var lines = [];
    ROUNDS.forEach(function (r, i) {
      var v = ansWithNote(ans, notes, i);
      if (v) lines.push("- " + r.label + "：" + v);
    });
    var featureNames = [];
    FEATURES.forEach(function (feature) {
      if (st.feats[feature.id]) featureNames.push(feature.name);
    });
    var charBudget = Math.round(budgetOf() * 0.62);
    return {
      system:
        "你是一名资深提示词工程师。把「原始需求 + 已确认的沟通记录」写成一份可以直接执行、能逐条验收的中文提示词。" +
        "只输出最终提示词正文（Markdown）。需求原文只用于理解，不要贴回正文；不要开场白、不要解释思考过程。" +
        "如果需求与沟通记录冲突，以用户已确认的沟通记录为准，并用一句可执行的规则消解冲突。",
      user:
        "原始需求：\n" + brief +
        "\n\n沟通记录（用户已确认，优先于你的默认假设）：\n" +
        (lines.length ? lines.join("\n") : "- 用户未补充，按需求推断并标注假设") +
        "\n\n生成参数：" +
        "\n- 详细程度：" + st.detail +
        "\n- 篇幅上限：约 " + charBudget + " 字（超出会被截断，务必在该范围内写完）" +
        "\n- 深度模式：" + (st.deep ? "开启：先完成初稿，再自评并修订，只输出修订后的最终稿" : "关闭") +
        "\n- 必须包含的小节：" + (featureNames.length ? featureNames.join("、") : "按需求自动补齐") +
        "\n\n硬性要求：结构用 # 小节；约束写成可判定的句子；不要输出「以下是」这类空话。"
    };
  }

  /* 深度模式的第二轮：只做审稿与修订，不再改变需求范围 */
  function buildReviewRequest(brief, ans, st, draft) {
    var lines = [];
    ROUNDS.forEach(function (r, i) {
      var v = ansWithNote(ans, notes, i);
      if (v) lines.push("- " + r.label + "：" + v);
    });
    return {
      system:
        "你是一名严格的中文提示词审稿人。检查初稿是否忠于原始需求、是否内部矛盾、是否有不可执行的约束。" +
        "只输出修订后的完整提示词 Markdown 正文，不要解释、不要复述需求、不要输出审稿过程。",
      user:
        "原始需求：\n" + brief +
        "\n\n已确认信息：\n" + (lines.length ? lines.join("\n") : "- 无额外补充") +
        "\n\n初稿：\n<<<\n" + draft + "\n>>>\n\n" +
        "审稿规则：\n" +
        "1. 删除互相冲突的规则，例如同时要求「复述需求」和「不要复述需求」。\n" +
        "2. 需求原文最多保留一次；没有新增信息的重复段落要删除。\n" +
        "3. 删除与任务无关的通用约束。\n" +
        "4. 验收标准必须能逐条判断；无法验证的表述改成可观察条件。\n" +
        "5. 不扩大或缩小用户已确认的需求范围。\n\n" +
        "请直接输出修订后的完整提示词。"
    };
  }

  function cleanModelOutput(text) {
    return String(text || "")
      .replace(/^\s*```(?:markdown|md)?\s*/i, "")
      .replace(/\s*```\s*$/i, "")
      .trim();
  }

  /* 深度模式：模型模式真实发起第二轮审阅；审阅失败时保留初稿，不把可用结果丢掉 */
  function runDeepReview(profile, draft, token) {
    if (!SET.deep || profile.source === "offline" || !draft) {
      return Promise.resolve({ text: draft, reviewed: false, reviewError: "" });
    }
    var request = buildReviewRequest(lastBrief, answers, SET, draft);
    var firstMeta = {
      firstMs: lastCall.firstMs,
      totalMs: lastCall.totalMs,
      chars: lastCall.chars,
      truncated: lastCall.truncated,
      reason: lastCall.reason,
      streaming: lastCall.streaming
    };
    genLabel.innerHTML = "深度模式 · <b>正在审阅并修订初稿</b>";
    return callModelProfile(profile, request.system, request.user, callOpts(token))
      .then(function (text) {
        var secondMeta = {
          firstMs: lastCall.firstMs,
          totalMs: lastCall.totalMs,
          chars: lastCall.chars,
          truncated: lastCall.truncated,
          reason: lastCall.reason,
          streaming: lastCall.streaming
        };
        lastCall = {
          firstMs: firstMeta.firstMs || secondMeta.firstMs,
          totalMs: (firstMeta.totalMs || 0) + (secondMeta.totalMs || 0),
          chars: text.length,
          truncated: secondMeta.truncated,
          reason: secondMeta.reason,
          streaming: !!(firstMeta.streaming || secondMeta.streaming)
        };
        return { text: cleanModelOutput(text), reviewed: true, reviewError: "" };
      })
      .catch(function (err) {
        lastCall = firstMeta;
        return {
          text: draft,
          reviewed: false,
          reviewError: (err && err.message) || String(err)
        };
      });
  }

  async function loadServerProfiles() {
    var savedKey = "";
    try { savedKey = localStorage.getItem("pw-selected-profile") || ""; } catch (e) {}
    /* 静态托管上不存在本地服务：探测过一次就不再重复，避免每次首屏都等一次 404 */
    var NO_SERVER = "pw-no-server";
    try { if (sessionStorage.getItem(NO_SERVER) === "1") { serverAvailable = false; return; } } catch (e) {}
    if (LOCAL_PROXY || location.protocol === "file:" || /(^|\.)github\.io$/i.test(location.hostname)) {
      serverAvailable = false;
      return;
    }
    try {
      var probe = new AbortController();
      var probeTimer = window.setTimeout(function () { probe.abort(); }, 1500);
      var resp = await fetch("/api/profiles", { cache: "no-store", signal: probe.signal });
      window.clearTimeout(probeTimer);
      if (!resp.ok) throw new Error("no local service");
      var data = await resp.json();
      serverAvailable = true;
      serverProfiles = (data.profiles || []).filter(function (p) {
        return p && p.enabled !== false;
      }).map(function (p) {
        return {
          key: "server:" + p.id,
          id: p.id,
          source: "server",
          name: p.name,
          modelId: p.modelId,
          baseUrl: p.baseUrl,
          protocol: p.protocol || "openai",
          apiKey: ""
        };
      });
      if (savedKey && allModelProfiles().some(function (p) { return p.key === savedKey; })) {
        setSelectedProfile(savedKey, false);
      } else if (SET.profileKey === "offline" && serverProfiles.length) {
        setSelectedProfile(serverProfiles[0].key, false);
      }
    } catch (e) {
      serverAvailable = false;
      try { sessionStorage.setItem(NO_SERVER, "1"); } catch (e2) {}
    }
    if (panelOpen) panelBody.innerHTML = panelHTML(panelOpen);
    refreshCaps();
  }

  /* 两步确认：第一次点击变成「确认」，3.2 秒内再点才执行，避免误删 */
  function armConfirm(btn, label, ariaLabel) {
    if (btn.dataset.armed === "1") return true;
    btn.dataset.armed = "1";
    btn.dataset.oldText = btn.textContent;
    btn.dataset.oldLabel = btn.getAttribute("aria-label") || "";
    btn.dataset.oldTitle = btn.getAttribute("title") || "";
    btn.classList.add("confirm");
    btn.textContent = label || "确认";
    if (ariaLabel) btn.setAttribute("aria-label", ariaLabel);
    btn.setAttribute("title", ariaLabel || label || "确认");
    window.setTimeout(function () {
      if (!document.body.contains(btn)) return;
      btn.dataset.armed = "";
      btn.classList.remove("confirm");
      if (btn.dataset.oldText) btn.textContent = btn.dataset.oldText;
      if (btn.dataset.oldLabel) btn.setAttribute("aria-label", btn.dataset.oldLabel);
      else btn.removeAttribute("aria-label");
      if (btn.dataset.oldTitle) btn.setAttribute("title", btn.dataset.oldTitle);
      else btn.removeAttribute("title");
    }, 3200);
    return false;
  }

    } else { fallbackCopy(txt); done(); }
  }

  function noteOf(kind) {
    if (kind === "detail") {
      return SET.detail === "精简" ? "精简：只给目标、步骤与一条硬约束，控制在半屏内。"
           : SET.detail === "详尽" ? "详尽：逐条列全，含边界情况、反例与失败处理，会比较长。"
           : "标准：角色 + 任务 + 约束 + 验收，长度约一屏，最常用。";
    }
    if (kind === "flow") {
      return SET.flow === "先沟通再生成"
        ? "先沟通再生成：发射后我先反问 " + ROUNDS.length + " 轮（可跳过、可回上一轮），把关键信息问清楚再落笔。"
        : "直接生成：不做反问，按你写的内容直接落笔，快但可能偏。";
    }
    if (kind === "timeout") {
      return "超时 " + SET.timeout + "s 内没等到第一个字就回退离线规则，已收到的内容仍保留。";
    }
    return "模型：" + selectedProfile().name +
      (selectedProfile().source === "offline" ? "（内置规则）" : "（已保存接口）");
  }

  function deepNoteText() {
    if (!SET.deep) return "关闭 · 开启后先出初稿，再自评并修订一版";
    return selectedProfile().source === "offline"
      ? "已开启 · 离线引擎会在提示词中追加自查要求"
      : "已开启 · 初稿后将调用一次自评并修订";
  }

  /* 面板高度跟着可用空间走：始终悬浮在输入框上方，不裁切、不覆盖 */
  function fitPanel() {
    if (!panel) return;
    var top = composer.getBoundingClientRect().top;
    /* 顶栏是固定定位且层级高于输入框，面板不能钻到它下面，否则首行会被遮住 */
    var barBottom = topbar ? topbar.getBoundingClientRect().bottom : 0;
    /* 不再强行保留 240px：320px 窄屏下这会把面板顶到导航下面。
       面板可滚动，优先保证顶部从导航下方开始。 */
    var avail = Math.floor(Math.max(120, Math.min(
      top - barBottom - 12,
      window.innerHeight - barBottom - 24
    )));
    panel.style.setProperty("--panelMax", Math.round(avail) + "px");
    panel.classList.toggle("scrollable", panelBody.scrollHeight - panelBody.clientHeight > 4);
  }

  function openPanel(cap) {
    if (panelOpen === cap) { closePanel(); return; }
    panelOpen = cap;
    panelBody.innerHTML = panelHTML(cap);
    panel.removeAttribute("inert");
    panel.classList.add("open");
    Array.prototype.forEach.call(band.children, function (b) {
      b.classList.toggle("on", b.dataset.cap === cap);
      if (b.dataset.cap && b.dataset.cap !== "deep") {
        b.setAttribute("aria-expanded", b.dataset.cap === cap ? "true" : "false");
      }
    });
    requestAnimationFrame(fitPanel);
  }
  function closePanel(refocus) {
    if (!panelOpen) return;
    var cap = panelOpen;
    panelOpen = null;
    panel.classList.remove("open");
    panel.classList.remove("scrollable");
    panel.setAttribute("inert", "");
    panelBody.scrollTop = 0;
    Array.prototype.forEach.call(band.children, function (b) {
      b.classList.remove("on");
      if (b.dataset.cap && b.dataset.cap !== "deep") b.setAttribute("aria-expanded", "false");
    });
    if (refocus) {
      var trigger = band.querySelector('.cap[data-cap="' + cap + '"]');
      if (trigger) trigger.focus();
    }
  }
  function refreshCaps() {
    var profile = selectedProfile();
    var modelCount = usableProfiles().length;
    var comparing = SET.mode === "多模型对比";
    var compareCount = comparing ? (modelCount >= 2 ? modelCount : 3) : 0;
    capModel.textContent = comparing
      ? (modelCount >= 2 ? compareCount + " 个模型" : "3 个离线版本")
      : profile.name;
    modelTag.textContent = comparing
      ? "多模型对比 · " + compareCount + " 个模型参与"
      : "生成模型 · " + profile.name;
    var multiBtn = modeSeg.querySelector('[data-v="多模型对比"]');
    if (multiBtn) {
      var nUsable = modelCount;
      var blocked = nUsable === 1;   /* 只有 1 个模型时对比没有意义；0 个时退回离线三版 */
      multiBtn.disabled = false;
      multiBtn.setAttribute("aria-disabled", blocked ? "true" : "false");
      multiBtn.classList.toggle("na", blocked);
      multiBtn.title = nUsable >= 2
        ? "用 " + nUsable + " 个可用模型各生成一版，逐版对比"
        : blocked
          ? "只有 1 个可用模型，先再添加一个，或改用单模型"
          : "离线规则会生成「精简 / 标准 / 详尽」三种风格，逐版对比";
    }
    var n = 0;
    for (var k in SET.feats) if (SET.feats[k]) n++;
    featNum.hidden = n === 0;
    featNum.textContent = String(n);
  }

  /* 深度模式开关：类名、aria、右侧状态词三处同时翻，避免「点了没反应」 */
  function paintDeep(btn) {
    if (!btn) return;
    btn.classList.toggle("on", SET.deep);
    btn.setAttribute("aria-checked", SET.deep ? "true" : "false");
    var note = btn.querySelector("[data-deep-note]");
    if (note) note.textContent = deepNoteText();
  }

  band.addEventListener("click", function (e) {
    var b = e.target.closest("[data-cap]");
    if (!b) return;
    var cap = b.dataset.cap;
    openPanel(cap);
  });

  panelBody.addEventListener("click", function (e) {
    /* --- 最近生成 --- */
    var histOpen = e.target.closest("[data-hist-open]");
    if (histOpen) { openStored(histOpen.dataset.histOpen); return; }
    var histCopy = e.target.closest("[data-hist-copy]");
    if (histCopy) {
      var hit = findHistory(histCopy.dataset.histCopy);
      if (hit) copyText(hit.prompt, "已复制这条提示词");
      return;
    }
    var histDel = e.target.closest("[data-hist-del]");
    if (histDel) {
      var arm = armConfirm(histDel, "确认", "确认删除这条记录");
      if (arm) removeHistory(histDel.dataset.histDel);
      return;
    }
    var histClear = e.target.closest("[data-hist-clear]");
    if (histClear) {
      var armAll = armConfirm(histClear, "确认清空", "确认清空全部历史记录");
      if (armAll) {
        history = [];
        persistHistory();
        panelBody.innerHTML = panelHTML("history");
        fitPanel();
        toast("历史已清空");
      }
      return;
    }
    /* --- 模型编辑 / 删除 --- */
    var editModel = e.target.closest("[data-edit-model]");
    if (editModel) {
      var target = profileByKey(editModel.dataset.editModel);
      if (target && target.source === "local") openModelDialog(target);
      return;
    }
    var delModel = e.target.closest("[data-del-model]");
    if (delModel) {
      var delTarget = profileByKey(delModel.dataset.delModel);
      var armed = armConfirm(delModel, "确认", "确认删除模型 " + delTarget.name);
      if (armed) deleteModel(delModel.dataset.delModel);
      return;
    }

    var modelChoice = e.target.closest("[data-profile-key]");
    if (modelChoice) {
      setSelectedProfile(modelChoice.dataset.profileKey);
      if (panelOpen) panelBody.innerHTML = panelHTML(panelOpen);
      return;
    }
    if (e.target.closest("[data-add-model]")) {
      openModelDialog();
      return;
    }
    if (e.target.closest("[data-test-model]")) {
      testSelectedModel();
      return;
    }
    var deepToggle = e.target.closest("[data-deep]");
    if (deepToggle) {
      SET.deep = !SET.deep;
      paintDeep(deepToggle);
      saveSettings();
      refreshCaps();
      live.textContent = SET.deep ? "深度模式已开启" : "深度模式已关闭";
      return;
    }
    var f = e.target.closest("[data-feat]");
    if (f) {
      var id = f.dataset.feat;
      SET.feats[id] = !SET.feats[id];
      f.classList.toggle("on", !!SET.feats[id]);
      f.setAttribute("aria-pressed", SET.feats[id] ? "true" : "false");
      saveSettings();
      refreshCaps();
      return;
    }
    var seg = e.target.closest(".seg [data-v]");
    if (seg) {
      var key = seg.parentNode.dataset.seg, v = seg.dataset.v;
      SET[key] = v;
      Array.prototype.forEach.call(seg.parentNode.children, function (x) {
        var on = x === seg;
        x.classList.toggle("on", on);
        x.setAttribute("aria-pressed", on ? "true" : "false");
      });
      /* 分区右上角的当前值同步，别让标题停在上一个选项 */
      var segGroup = seg.closest(".menuGroup");
      var segTitle = segGroup && segGroup.querySelector(".menuTitle b");
      if (segTitle) segTitle.textContent = v;
      saveSettings();
      var note = el("note" + key.charAt(0).toUpperCase() + key.slice(1));
      if (note) note.textContent = noteOf(key);
      refreshCaps();
      if (key === "flow") { /* 影响下一次发射的路径 */ }
      return;
    }
    var action = e.target.closest("[data-act]");
    if (action) {
      handleMenuAction(action.dataset.act);
    }
  });

  modeSeg.addEventListener("click", function (e) {
    var b = e.target.closest("[data-v]");
    if (!b) return;
    if (b.dataset.v === "多模型对比") {
      var list = usableProfiles();
      if (list.length === 1) {
        toast("多模型对比至少需要 2 个可用模型，当前只有「" + list[0].name +
          "」。再添加一个带 Key 的模型，或先用单模型。", "warn");
        return;
      }
      toast(list.length >= 2
        ? "已切换多模型对比：会用 " + list.length + " 个模型各生成一版。"
        : "已切换多模型对比：离线规则会生成精简 / 标准 / 详尽三版。", "ok");
    }
    SET.mode = b.dataset.v;
    Array.prototype.forEach.call(modeSeg.children, function (x) {
      var on = x === b;
      x.classList.toggle("on", on);
      x.setAttribute("aria-pressed", on ? "true" : "false");
    });
    refreshCaps();
  });

  /* ================= 弹窗壳（沟通 / 结果共用） ================= */
  var bgNodes = [topbar, stage, composer];
  function setBackgroundInert(on) {
    for (var i = 0; i < bgNodes.length; i++) {
      var n = bgNodes[i];
      if (!n) continue;
      if (on) n.setAttribute("inert", ""); else n.removeAttribute("inert");
    }
  }
  function originFromOrbit() {
    if (!ORB.ready) fitOrbit();
    var cs = window.getComputedStyle(overlay);
    var pB = parseFloat(cs.paddingBottom) || 0;
    var pL = parseFloat(cs.paddingLeft) || 0;
    var pR = parseFloat(cs.paddingRight) || 0;
    var W = sheet.offsetWidth, H = sheet.offsetHeight;
    if (!W || !H) return;
    var or = overlay.getBoundingClientRect();
    var left = or.left + pL + (or.width - pL - pR - W) / 2;
    var top = or.bottom - pB - H;
    sheet.style.setProperty("--ox", r2((ORB.cx - left) / W * 100) + "%");
    sheet.style.setProperty("--oy", r2((ORB.cy - top) / H * 100) + "%");
  }
  function openSheet(opts) {
    var gen = ++sheetGen;
    sheetKind = opts.kind || "";
    sheet.classList.toggle("result", !!opts.result);
    sheet.classList.toggle("wide", false);
    sheetTitle.textContent = opts.title;
    sheetBadge.hidden = !opts.badge;
    sheetBadge.textContent = opts.badge || "";
    sheetMeta.textContent = opts.meta || "";
    sheetBody.innerHTML = opts.body;
    sheetFoot.innerHTML = opts.foot;
    sheetFoot.classList.toggle("left", !!opts.footLeft);
    scrim.classList.add("on");
    sheet.hidden = false;
    originFromOrbit();
    setBackgroundInert(true);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        if (gen !== sheetGen) return;
        sheet.classList.add("on");
        if (opts.after) opts.after();
      });
    });
    sheetOpenedAt = Date.now();
    requestAnimationFrame(function () {
      if (gen !== sheetGen) return;
      try { sheet.focus({ preventScroll: true }); } catch (e) { sheet.focus(); }
    });
  }
  function closeSheet(done) {
    if (sheet.hidden) { if (done) done(); return; }
    var gen = ++sheetGen;
    var wasWide = sheet.classList.contains("wide");
    sheet.classList.remove("on");
    scrim.classList.remove("on");
    setBackgroundInert(false);
    var finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      sheet.removeEventListener("transitionend", onEnd);
      window.clearTimeout(fallback);
      if (gen === sheetGen) {
        sheet.hidden = true;
        sheet.classList.remove("wide");
        sheetKind = "";
      }
      if (done) done();
    }
    function onEnd(ev) {
      if (ev.target !== sheet || ev.propertyName !== "opacity") return;
      finish();
    }
    sheet.addEventListener("transitionend", onEnd);
    var fallback = window.setTimeout(finish, wasWide ? 460 : 420);
  }

  function closeModelDialog() {
    closeSheet(function () {
      if (addModelBtn) addModelBtn.focus();
    });
  }

  function openModelDialog(editing) {

    openSheet({

              '<input id="mName" type="text" maxlength="32" autocomplete="off" ' +

              'placeholder="不填则使用服务商 + 模型 ID"></div>' +
            '<div class="mField"><label for="mBaseUrl">接口地址</label>' +

              '<select id="mProtocol">' +
                '<option value="openai">OpenAI 兼容</option>' +
                '<option value="anthropic"' + (isEdit && editing.protocol === "anthropic" ? " selected" : "") + '>Anthropic</option>' +
              '</select></div>' +
          '</details>' +
          '<p class="mHint">' + storageHint + '</p>' +
          '<p class="mTestNote" id="mTestNote" role="status" aria-live="polite"></p>' +
          '<p class="mError" id="mError" role="alert" aria-live="assertive" hidden></p>' +
        "</div>",
      foot:
        '<button class="btn ghost" id="btnCancelModel" type="button">取消</button>' +
        '<button class="btn ghost" id="btnTestDraft" type="button">测试连接</button>' +
        '<button class="btn primary" id="btnSaveModel" type="button">' +
        (isEdit ? "保存修改" : "保存模型") + '</button>',
      after: function () {
        var nameEl = el("mName");

        var baseEl = el("mBaseUrl");
        var protocolEl = el("mProtocol");
        var keyEl = el("mApiKey");
