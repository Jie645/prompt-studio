          var preset = PROVIDER_PRESETS[presetEl.value] || PROVIDER_PRESETS.custom;
          var modelId = modelEl.value.trim() || preset.model;
          var baseUrl = normalizeBaseUrl(baseEl.value.trim() || preset.baseUrl);
          var name = nameEl.value.trim() || (preset.name + (modelId ? " · " + modelId : ""));
          return {
            key: isEdit ? editing.key : "local:draft",
            id: isEdit ? editing.id : "draft",
            source: "local",
            name: name,
            modelId: modelId,
            baseUrl: baseUrl,
            protocol: protocolEl.value || preset.protocol,
            apiKey: keyEl.value.trim() || (isEdit ? editing.apiKey : "")
          };
        }

        function showError(message, field) {
          errorEl.hidden = false;
          errorEl.textContent = message;
          [nameEl, modelEl, baseEl, keyEl].forEach(function (f) { f.removeAttribute("aria-invalid"); });
          if (field) field.setAttribute("aria-invalid", "true");
        }
        [nameEl, modelEl, baseEl].forEach(function (field) {
          field.addEventListener("input", function () {
            field.removeAttribute("aria-invalid");
            errorEl.hidden = true;
          });
        });

        async function saveModel() {
          var draft = draftProfile();
          var name = draft.name;
          var modelId = draft.modelId;
          var baseUrl = draft.baseUrl;
          var protocol = draft.protocol;
          var apiKey = draft.apiKey;
          if (!/^[\p{L}\p{N} ._\-·]+$/u.test(name)) {
            showError("名称只支持文字、数字、空格、点、横线和下划线。", nameEl);
            nameEl.focus();
            return;
          }
          if (!modelId) {
            showError("请填写模型 ID。", modelEl);
            modelEl.focus();
            return;
          }
          if (!baseUrl) {
            showError("请填写接口地址。", baseEl);
            baseEl.focus();
            return;
          }
          try {
            var parsed = new URL(baseUrl);
            if (parsed.protocol !== "http:" && parsed.protocol !== "https:") throw new Error();
          } catch (e) {
            showError("接口地址必须是有效的 http(s) URL；选择服务商模板可自动填好。", baseEl);
            baseEl.focus();
            return;
          }
          var duplicate = allModelProfiles().some(function (item) {
            if (item.source === "offline") return false;
            if (isEdit && item.key === editing.key) return false;
            return item.name.toLowerCase() === name.toLowerCase();
          });
          if (duplicate) {
            showError("这个模型名称已经存在，请换一个。", nameEl);
            nameEl.focus();
            return;
          }

          errorEl.hidden = true;
          saveBtn.disabled = true;
          saveBtn.textContent = "保存中…";
          try {
            if (isEdit) {
              var keptKey = editing.key;
              customModels = customModels.map(function (m) {
                if (m.key !== keptKey) return m;
                return {
                  key: m.key, id: m.id, source: "local",
                  name: name, modelId: modelId, baseUrl: baseUrl,
                  protocol: protocol,
                  apiKey: apiKey || m.apiKey
                };
              });
              saveCustomModels();
              setSelectedProfile(keptKey);
              closeSheet(function () {
                addModelBtn.focus();
                toast("已更新模型：" + name, "ok");
              });
              return;
            }
            if (serverAvailable) {
              var resp = await fetch("/api/profiles", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({
                  name: name,
                  protocol: protocol,
                  baseUrl: baseUrl,
                  modelId: modelId,
                  apiKey: apiKey,
                  enabled: true,
                  params: protocol === "anthropic" ? { maxTokens: 4096 } : {}
                })
              });
              if (!resp.ok) throw new Error(await readApiError(resp));
              var data = await resp.json();
              var saved = data.profile;
              serverProfiles.push({
                key: "server:" + saved.id,
                id: saved.id,
                source: "server",
                name: saved.name,
                modelId: saved.modelId,
                baseUrl: saved.baseUrl,
                protocol: saved.protocol || protocol,
                apiKey: ""
              });
              setSelectedProfile("server:" + saved.id);
            } else {
              var localId = "m-" + Date.now().toString(36);
              customModels.push({
                key: "local:" + localId,
                id: localId,
                source: "local",
                name: name,
                modelId: modelId,
                baseUrl: baseUrl,
                protocol: protocol,
                apiKey: apiKey
              });
              saveCustomModels();
              setSelectedProfile("local:" + localId);
            }
            closeSheet(function () {
              addModelBtn.focus();
              toast("已添加模型：" + name, "ok");
            });
          } catch (err) {
            saveBtn.disabled = false;
            saveBtn.textContent = isEdit ? "保存修改" : "保存模型";
            showError("保存失败：" + ((err && err.message) || err));
          }
        }

        async function testDraft() {
          var draft = draftProfile();
          if (!draft.modelId) {
            showError("请填写模型 ID。", modelEl);
            modelEl.focus();
            return;
          }
          if (!draft.baseUrl) {
            showError("请选择服务商模板，或展开高级设置填写接口地址。", baseEl);
            baseEl.focus();
            return;
          }
          errorEl.hidden = true;
          testNote.textContent = "正在测试 " + draft.name + "…";
          testNote.style.color = "var(--ink3)";
          testBtn.disabled = true;
          testBtn.textContent = "测试中…";
          var started = performance.now();
          try {
            var reply = await callModelProfile(
              draft,
              "You are a connectivity probe. Reply briefly.",
              "Reply with OK.",
              { allowShort: true, maxTokens: 32 }
            );
            testNote.textContent = "连接成功 · " + Math.round(performance.now() - started) + "ms" +
              (reply ? " · " + reply.slice(0, 24) : "");
            testNote.style.color = "var(--ok)";
          } catch (err) {
            testNote.textContent = "连接失败：" + ((err && err.message) || err);
            testNote.style.color = "var(--err)";
          } finally {
            testBtn.disabled = false;
            testBtn.textContent = "测试连接";
          }
        }

        el("btnCancelModel").addEventListener("click", closeModelDialog);
        el("btnSaveModel").addEventListener("click", saveModel);
        testBtn.addEventListener("click", testDraft);
        [nameEl, modelEl, baseEl, keyEl].forEach(function (field) {
          field.addEventListener("keydown", function (event) {
            if (event.key === "Enter" && !event.isComposing) {
              event.preventDefault();
              saveModel();
            }
          });
        });
        requestAnimationFrame(function () { modelEl.focus(); });
      }
    });
  }

  /* ================= 沟通轮次（弹窗） ================= */
  var roundIdx = 0;
  var picked = {};

  function askedCount() {
    var n = 0;
    for (var i = 0; i < ROUNDS.length; i++) {
      if (ansText(answers[i]) || ansText(notes[i])) n++;
    }
    return n;
  }
  /* 结果页 / 模型请求里用的合并值：选项 +（补充） */
  function ansWithNote(list, noteList, i) {
    var v = ansText(list[i]);
    var n = ansText(noteList[i]);
    if (v && n) return v + "（补充：" + n + "）";
    return v || n;
  }

  function askBody(r) {
    var h = '<div class="qProg" aria-hidden="true">';
    ROUNDS.forEach(function (_, i) {
      h += '<i class="' + (i < roundIdx ? "done" : i === roundIdx ? "on" : "") + '"></i>';
    });
    h += "</div>";
    h += '<p class="qTitle">' + esc(r.q) + "</p>";
    h += '<p class="qSub">' + esc(r.sub) + "</p>";
    if (r.why) h += '<p class="qWhy">' + esc(r.why) + "</p>";
    h += '<div class="optGrid' + (r.opts.length > 4 ? " dense" : "") + '" id="optGrid"' +
         ' role="group" aria-label="' + esc(r.q) + '">';
    r.opts.forEach(function (o, i) {
      h += '<button class="opt" type="button" data-i="' + i + '" aria-pressed="false">' +
           "<b>" + esc(o.v) + "</b><span>" + esc(o.d) + "</span></button>";
    });
    h += "</div>";
    h += '<p class="qHint" id="qHint">' +
         (r.multi ? "可多选：点几下选中几项" : "选一项，或在下面直接写") + "</p>";
    var rest = ROUNDS.length - roundIdx - 1;
    if (rest > 0) {
      h += '<button class="skipRest" type="button" id="btnSkipRest">' +
           "跳过剩余 " + rest + " 轮，直接生成</button>";
    }
    h += '<div class="freeWrap"><div class="freeLabel">补充</div>' +
         '<textarea class="free" id="freeAns" rows="2" ' +
         'aria-label="补充说明" ' +
         'placeholder="可以再补一句话，比如具体场景、已有的约束、上次踩过的坑。"></textarea>' +
         '<span class="freeHint">Ctrl / ⌘ + Enter 提交</span></div>';
    return h;
  }

  function askFoot() {
    var last = roundIdx === ROUNDS.length - 1;
    return '<button class="btn ghost" id="btnBack" type="button"' +
             (roundIdx === 0 ? " disabled" : "") + '>上一轮</button>' +
           '<button class="btn ghost" id="btnSkip" type="button">这轮跳过</button>' +
           '<button class="btn primary" id="btnSubmit" type="button">' +
             (last ? "提交并生成" : "提交回答") + '</button>';
  }

  function askMeta() {
    return "共 " + ROUNDS.length + " 轮 · 已填 " + askedCount() + " 项";
  }

  function updateAskHint() {
    var hint = el("qHint");
    if (!hint) return;
    var r = ROUNDS[roundIdx];
    if (!r.multi) {
      hint.textContent = picked.values.length
        ? "已选：" + picked.values[0]
        : "选一项，或在下面直接写";
      return;
    }
    hint.textContent = picked.values.length
      ? "已选 " + picked.values.length + " 项：" + picked.values.join("、")
      : "可多选：点几下选中几项";
  }

  function bindAsk() {
    var r = ROUNDS[roundIdx];
    var grid = el("optGrid");
    var free = el("freeAns");
    picked = { values: [] };

    /* 回上一轮时把已答内容还原：能对上选项的点亮，对不上的回到补充框 */
    var prev = ansText(answers[roundIdx]);
    var prevNote = ansText(notes[roundIdx]);
    if (prevNote) free.value = prevNote;
    if (prev) {
      var tokens = r.multi ? prev.split("、") : [prev];
      tokens.forEach(function (t) {
        var hit = -1;
        r.opts.forEach(function (o, i) { if (o.v === t) hit = i; });
        if (hit >= 0) {
          picked.values.push(r.opts[hit].v);
          grid.children[hit].classList.add("on");
          grid.children[hit].setAttribute("aria-pressed", "true");
        } else if (t) {
          free.value = free.value ? free.value + "、" + t : t;
        }
      });
    }

    grid.addEventListener("click", function (e) {
      var b = e.target.closest(".opt");
      if (!b) return;
      var val = r.opts[Number(b.dataset.i)].v;
      if (r.multi) {
        var k = picked.values.indexOf(val);
        if (k >= 0) picked.values.splice(k, 1); else picked.values.push(val);
        b.classList.toggle("on", k < 0);
        b.setAttribute("aria-pressed", k < 0 ? "true" : "false");
      } else {
        picked.values = [val];
        Array.prototype.forEach.call(grid.children, function (x) {
          x.classList.toggle("on", x === b);
          x.setAttribute("aria-pressed", x === b ? "true" : "false");
        });
      }
      updateAskHint();
    });
    free.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && (e.key === "Enter" || e.keyCode === 13)) {
        e.preventDefault(); submitRound(true);
      }
    });
    el("btnSkip").addEventListener("click", function () { submitRound(false); });
    el("btnSubmit").addEventListener("click", function () { submitRound(true); });
    var skipRest = el("btnSkipRest");
    if (skipRest) {
      skipRest.addEventListener("click", function () {
        for (var i = roundIdx; i < ROUNDS.length; i++) {
          if (answers[i] === undefined) answers[i] = "";
        }
        roundIdx = ROUNDS.length;
        closeSheet(function () { startGenerating(); });
      });
    }
    var back = el("btnBack");
    if (back) back.addEventListener("click", goBack);
    updateAskHint();
    live.textContent = "第 " + (roundIdx + 1) + " 轮沟通：" + r.q;
  }

  function openAsk() {
    state = ST_ASK;
    openSheet({
      result: false,
      title: "沟通补充 · 第 " + (roundIdx + 1) + " 轮",
      meta: askMeta(),
      body: askBody(ROUNDS[roundIdx]),
      foot: askFoot(),
      after: bindAsk
    });
  }

  /* 上一轮：原地换内容，不关弹窗，避免闪一下 */
  function goBack() {
    if (roundIdx === 0) return;
    roundIdx--;
    sheetTitle.textContent = "沟通补充 · 第 " + (roundIdx + 1) + " 轮";
    sheetMeta.textContent = askMeta();
    sheetBody.innerHTML = askBody(ROUNDS[roundIdx]);
    sheetFoot.innerHTML = askFoot();
    bindAsk();
    sheetBody.scrollTop = 0;
  }

  function submitRound(submit) {
    var free = el("freeAns");
    var extra = free ? free.value.trim() : "";
    var r = ROUNDS[roundIdx];
    if (submit && !extra && !picked.values.length) {
      var grid = el("optGrid");
      if (grid) {
        grid.classList.add("need");
        window.setTimeout(function () { grid.classList.remove("need"); }, 1600);
      }
      toast("先选一个选项，或在「补充」里写一句", "warn");
      return;
    }
    var vals = picked.values.slice();
    /* 只写了补充、没选选项时，补充就是这一轮的答案；选了选项则补充单独留档 */
    answers[roundIdx] = submit ? (vals.join("、") || extra) : "";
    notes[roundIdx] = submit && vals.length ? extra : "";
    closeSheet(function () {
      roundIdx++;
      if (roundIdx < ROUNDS.length) { openAsk(); return; }
      startGenerating();
    });
  }

  /* ================= 生成：界面只剩轨道在转 ================= */
  var STAGES = [
    { t: 560, name: "解析需求" },
    { t: 900, name: "撰写提示词" },
    { t: 620, name: "严格评审" },
    { t: 700, name: "按意见修订" }
  ];
  function startGenerating() {
    state = ST_GEN;
    var genStartAt = Date.now();
    abortActiveCall("新一轮生成开始");
    resetCallMeta();
    var token = ++generationToken;
    genCancelAt = 0;
    var profile = selectedProfile();
    var remotePromise = null;
    progBar.style.strokeDashoffset = String(CIRC);
    prog.classList.add("on");
    genLabel.classList.add("on");
    orbitStart();

    /* 多模型对比：可用模型 ≥2 时并发各生成一版 */
    var compareList = SET.mode === "多模型对比" ? usableProfiles().slice(0, 4) : [];
    if (compareList.length >= 2) {
      remotePromise = Promise.all(compareList.map(function (p) {
        var req = buildModelRequest(lastBrief, answers, SET, p);
        return callModelProfile(p, req.system, req.user, callOpts(token))
          .then(function (text) {
            return runDeepReview(p, cleanModelOutput(text), token)
              .then(function (rev) {
                return {
                  ok: true, profile: p, text: rev.text,
                  reviewed: rev.reviewed, reviewError: rev.reviewError
                };
              });
          })
          .catch(function (err) {
            return { ok: false, profile: p, text: "", error: (err && err.message) || String(err) };
          });
      })).then(function (list) {
        var okList = list.filter(function (r) { return r.ok && r.text; });
        var bad = list.filter(function (r) { return !r.ok || !r.text; });
        var reviewBads = okList.filter(function (r) { return r.reviewError; });
        var failText = bad.length
          ? (bad.length === list.length
              ? "全部模型失败（" + list.length + " 个）"
              : "部分模型失败（" + bad.length + "/" + list.length + "）") +
            "：" + bad.map(function (r) { return r.profile.name; }).join("、") +
            "。" + (bad[0].error || "无返回")
          : "";
        var reviewText = reviewBads.length
          ? "深度审阅失败：" + reviewBads.map(function (r) { return r.profile.name; }).join("、") +
            "。已保留对应初稿。"
          : "";
        return {
          ok: okList.length > 0,
          isCompare: true,
          badCount: bad.length,
          totalCount: list.length,
          variants: okList.map(function (r) {
            return {
              label: r.profile.name,
              prompt: r.text,
              score: scorePrompt(r.text).total,
              reviewed: !!r.reviewed
            };
          }),
          error: [failText, reviewText].filter(Boolean).join("；")
        };
      });
    } else if (profile.source !== "offline") {
      var request = buildModelRequest(lastBrief, answers, SET, profile);
      remotePromise = callModelProfile(profile, request.system, request.user, callOpts(token))
        .then(function (text) {
          return runDeepReview(profile, cleanModelOutput(text), token)
            .then(function (rev) {
              return {
                ok: true, text: rev.text, error: "",
                reviewed: rev.reviewed, reviewError: rev.reviewError
              };
            });
        })
        .catch(function (err) {
          return { ok: false, text: "", error: (err && err.message) || String(err) };
        });
    }

    /* 深度模式 + 在线模型才真正跑「初稿 → 审阅 → 修订」；
       离线引擎无法发第二轮，只追加自查要求。 */
    var deepModelRun = SET.deep && (compareList.length >= 2 || profile.source !== "offline");
    var stages = deepModelRun
      ? STAGES
      : [
          { t: 560, name: "解析需求" },
          { t: 900, name: "撰写提示词" },
          { t: 700, name: "校对与定稿" }
        ];

    var settled = false;
    function settle() {
      if (settled) return;
      if (token !== generationToken || state !== ST_GEN) return;
      settled = true;
      if (!remotePromise) {
        finishGenerating(token, profile, { ok: true, text: "", error: "" });
        return;
      }
      var ticker = window.setInterval(function () {
        if (token !== generationToken || state !== ST_GEN) {
          window.clearInterval(ticker);
          return;
        }
        var sec = ((Date.now() - genStartAt) / 1000).toFixed(1);
        genLabel.innerHTML = "等待 " + esc(profile.name) + " · <b>" + sec + "s</b>" +
          (streamFirst ? " · 首字 " + (streamFirst / 1000).toFixed(1) + "s" : "") +
          (streamChars ? " · " + streamChars + " 字" : "") +
          ' · <span class="genEsc">Esc 取消</span>';
      }, 300);
      remotePromise.then(function (result) {
        window.clearInterval(ticker);
        finishGenerating(token, profile, result);
      });
    }

    if (reducedMotion()) {
      genLabel.innerHTML = "正在生成 · <b>" + stages.length + " / " + stages.length + "</b> 定稿";
      progBar.style.strokeDashoffset = "0";
      window.setTimeout(settle, REDUCED_MS);
      return;
    }

    /* 取消后不再演后面几步：文案改成一句实话，然后立刻走离线稿 */
    function cancelStage() {
      if (state !== ST_GEN) return;
      genLabel.innerHTML = "已取消 · 正在用离线规则出稿…";
      progBar.style.strokeDashoffset = "0";
      settle();
    }

    var total = 0;
    stages.forEach(function (s) { total += s.t; });
    var i = 0;
    function stage(n) {
      if (genCancelAt) { cancelStage(); return; }
      if (streamActive) { settle(); return; }
      i = n;
      genLabel.innerHTML = "正在生成 · <b>" + n + " / " + stages.length + "</b> " + stages[n - 1].name;
      window.setTimeout(function () {
        if (genCancelAt) { cancelStage(); return; }
        if (streamActive) { settle(); return; }
        if (n < stages.length) { stage(n + 1); return; }
        settle();
      }, stages[n - 1].t);
    }
    stage(1);

    var acc = 0, last = 0;
    function frame(now) {
      if (state !== ST_GEN) return;
      if (!last) last = now;
      var dt = now - last; last = now;
      if (dt < 0) dt = 0;
      if (dt > DT_MAX) dt = DT_MAX;
      acc += dt;
      var t = Math.min(1, acc / total);
      if (streamActive) {
        progBar.style.strokeDashoffset = String(CIRC * (1 - 0.92));
        return;
      }
      progBar.style.strokeDashoffset = String(CIRC * (1 - t));
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    live.textContent = "开始生成提示词，共 " + stages.length + " 步";
  }

  /* 流式回调：把首字延迟和已接收字数直接显示在轨道下方，用户知道它在动 */
  function callOpts(token) {
    return {
      maxTokens: budgetOf(),
      onFirstToken: function (ms) {
        if (token !== generationToken) return;
        streamActive = true;
        setOrbitPeriod(6800);   // 连上了：转快一点，让人看出「在动」
        genLabel.innerHTML = "已连上 · <b>首字 " + (ms / 1000).toFixed(1) + "s</b>";
      },
      onProgress: function (chars, firstMs) {
        if (token !== generationToken || state !== ST_GEN) return;
        genLabel.innerHTML = "正在接收 · <b>" + chars + "</b> 字" +
          (firstMs ? " · 首字 " + (firstMs / 1000).toFixed(1) + "s" : "");
      }
    };
  }

  function finishGenerating(token, profile, result) {
    if (token !== generationToken || state !== ST_GEN) return;
    progBar.style.strokeDashoffset = "0";
    orbitStop("finish");
    genLabel.classList.remove("on");
    var fallback = composePrompt(lastBrief, answers, SET);
    if (result && result.variants && result.variants.length) {
      /* 多模型对比：拿回几版就展示几版 */
      pendingVariants = result.variants;
      lastPrompt = result.variants[0].prompt;
      lastScore = result.variants[0].score;
      lastGeneration = {
        mode: "model",
        profileName: result.variants.length + "/" + result.totalCount + " 个模型成功",
        error: result.error || "",
        ms: lastCall.totalMs,
        firstMs: lastCall.firstMs,
        truncated: lastCall.truncated,
        deep: SET.deep,
        reviewed: result.variants.some(function (v) { return !!v.reviewed; }),
        stageCount: SET.deep ? 4 : 3
      };
      if (result.error) toast(result.error, "warn");
    } else if (result && result.isCompare) {
      /* 所有对比模型都失败：明确走离线回退，不再伪装成单模型结果 */
      lastPrompt = fallback;
      lastGeneration = {
        mode: "fallback",
        profileName: "多模型对比",
        error: result.error || "全部模型失败。",
        ms: lastCall.totalMs,
        deep: SET.deep,
        reviewed: false,
        stageCount: 3
      };
      statusPill.classList.add("off");
      statusPill.classList.remove("mode");
      statusTxt.textContent = "离线回退";
      statusPill.title = lastGeneration.error;
    } else if (profile.source !== "offline") {
      if (result.ok && result.text) {
        lastPrompt = result.text;
        lastGeneration = {
          mode: "model",
          profileName: profile.name,
          error: "",
          ms: lastCall.totalMs,
          firstMs: lastCall.firstMs,
          truncated: lastCall.truncated,
          reason: lastCall.reason,
          deep: SET.deep,
          reviewed: !!result.reviewed,
          reviewError: result.reviewError || "",
          stageCount: SET.deep ? 4 : 3
        };
        updateModeStatus();
      } else {
        lastPrompt = fallback;
        lastGeneration = {
          mode: "fallback",
          profileName: profile.name,
          error: result.error || "模型没有返回可用文本。",
          ms: lastCall.totalMs,
          deep: SET.deep,
          reviewed: false,
          stageCount: 3
        };
        statusPill.classList.add("off");
        statusPill.classList.remove("mode");
        statusTxt.textContent = "离线回退";
        statusPill.title = lastGeneration.error;
      }
    } else {
      lastPrompt = fallback;
      lastGeneration = {
        mode: "offline", profileName: "离线规则", error: "",
        deep: SET.deep, reviewed: false, stageCount: 3
      };
    }
    var scored = scorePrompt(lastPrompt);
    lastScore = scored.total;
    lastDims = scored;
    window.setTimeout(openResult, reducedMotion() ? 0 : 300);
  }

  /* ================= 结果（弹窗） ================= */
  function variantSet(base, model, detail, deep) {
    return {
      detail: detail || base.detail,
      flow: base.flow,
      deep: deep === undefined ? base.deep : deep,
      model: model || base.model,
      mode: base.mode,
      feats: base.feats
    };
  }

  function buildVariants(brief, ans, st) {
    if (st.mode !== "多模型对比") {
      var one = composePrompt(brief, ans, st);
      return [{ label: st.model, prompt: one, score: scorePrompt(one).total }];
    }
    var specs = [
      { label: "精简版", grain: "精简骨架", detail: "精简", deep: false },
      { label: "标准版", grain: "标准交付", detail: "标准", deep: false },
      { label: "详尽版", grain: "详尽穷尽", detail: "详尽", deep: true }
    ];
    return specs.map(function (spec) {
      var ans2 = ans.slice();
      ans2[1] = spec.grain;
      var vset = variantSet(st, st.model, spec.detail, spec.deep);
      var prompt = composePrompt(brief, ans2, vset);
      return { label: spec.label, model: st.model, prompt: prompt, score: scorePrompt(prompt).total };
    });
  }

  function paintVariant(idx) {
    var v = resultVariants[idx];
    if (!v) return;
    resultIdx = idx;
    lastPrompt = v.prompt;
    var scored = scorePrompt(v.prompt);
    lastScore = scored.total;
    lastDims = scored;
    v.score = scored.total;
    sheetBadge.textContent = lastScore + " 分";
    var len = v.prompt.length;
    var meta = el("resMeta");
    if (meta) meta.textContent = fmtNum(len) + " 字 · ~" + fmtNum(Math.round(len * 1.5)) + " tokens";
    var wrap = el("dimsWrap");
    if (wrap) {
      wrap.innerHTML = dimsHTML(scored) + '<p class="dimNote"><b>改进建议：</b>' + esc(scored.advice.join(" ")) + "</p>";
    }
    var out = el("codeOut");
    if (out) out.value = v.prompt;
    var use = el("btnUse");
    if (use) {
      use.disabled = false;
      use.classList.remove("used");
      use.textContent = resultVariants.length > 1 ? "用这版" : "用这版";
    }
    Array.prototype.forEach.call(document.querySelectorAll(".variant"), function (b) {
      var on = Number(b.dataset.v) === idx;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function dimsHTML(sc) {
    var h = '<div class="dims">';
    sc.dims.forEach(function (d) {
      var pct = Math.max(4, Math.round(d.v / d.max * 100));
      h += '<div class="dim" title="' + esc(d.note) + '">' +
        "<b>" + d.k + "</b><i>" + d.v + "<u>/" + d.max + "</u></i>" +
        '<div class="dimBar"><span style="transform:scaleX(' + (pct / 100) + ')"></span></div>' +
      "</div>";
    });
    h += "</div>";
    return h;
  }

  function openResult() {
    state = ST_RESULT;
    var fromHistory = lastGeneration.mode === "history";
    var answered = askedCount();

    if (pendingVariants && pendingVariants.length) {
      resultVariants = pendingVariants;
      pendingVariants = null;
    } else if (lastGeneration.mode === "model" || lastGeneration.mode === "fallback") {
      resultVariants = [{ label: lastGeneration.profileName, prompt: lastPrompt, score: lastScore }];
    } else {
      resultVariants = buildVariants(lastBrief, answers, SET);
    }
    resultIdx = 0;
    lastPrompt = resultVariants[0].prompt;
    var scored = scorePrompt(lastPrompt);
    lastScore = resultVariants[0].score || scored.total;
    lastDims = scored;

    var len = lastPrompt.length;
    var tk = Math.round(len * 1.5);
    var stageCount = lastGeneration.stageCount || 3;
    var deepSuffix = "";
    if (!fromHistory && lastGeneration.deep) {
      deepSuffix = lastGeneration.mode === "model"
        ? (lastGeneration.reviewed
            ? " · 深度模式：已完成自评与修订"
            : " · 深度模式：审阅失败，已保留初稿")
        : " · 深度模式：离线引擎已追加自查要求";
    }
    var steps = fromHistory
      ? "从「最近生成」中打开的历史版本，可以直接复制、导出或采用"
      : stageCount + " / " + stageCount + " 步全部完成 · " +
        (SET.flow === "先沟通再生成"
          ? (answers.filter(Boolean).length
              ? "已按 " + answers.filter(Boolean).length + " 轮回答补全"
              : "已跳过反问")
          : "未做反问，直接成稿") +
        deepSuffix;
    var engineLabel = lastGeneration.mode === "model"
      ? "模型生成 · " + lastGeneration.profileName
      : lastGeneration.mode === "fallback"
        ? "模型调用失败 · 已回退离线规则"
        : fromHistory
          ? "历史版本 · " + (lastGeneration.profileName || "离线规则")
          : "离线规则引擎";
    var warnParts = [];
    if (lastGeneration.mode === "fallback" && lastGeneration.error) {
      warnParts.push(esc(lastGeneration.error) + " 已自动改用离线规则出稿，内容仍可直接使用。");
    }
    if (lastGeneration.truncated) {
      warnParts.push("模型输出提前中断" +
        (lastGeneration.reason ? "（" + esc(lastGeneration.reason) + "）" : "") +
        "，已保留收到的 " + fmtNum(len) + " 字；可以点「重试模型」，或在下面的编辑框里补完。");
    }
    if (lastGeneration.mode === "model" && lastGeneration.error) {
      warnParts.push(esc(lastGeneration.error));
    }
    if (lastGeneration.reviewError) {
      warnParts.push("深度审阅第二轮失败（" + esc(lastGeneration.reviewError) + "），已保留初稿。");
    }
    var warning = warnParts.length
      ? '<p class="resWarn" role="status">' + warnParts.join("<br>") + "</p>"
      : "";

    /* 耗时体检：首字延迟 + 总耗时，慢的时候用户能一眼看出卡在哪 */
    var speed = "";
    if (!fromHistory && lastGeneration.ms) {
      speed = '<span class="resSpeed" title="从发请求到收到第一个字 / 到全部收完">' +
        (lastGeneration.firstMs ? "首字 " + (lastGeneration.firstMs / 1000).toFixed(1) + "s · " : "") +
        "共 " + (lastGeneration.ms / 1000).toFixed(1) + "s" +
        (lastCall.streaming ? " · 流式" : "") + "</span>";
    }

    /* 已确认信息：6 轮问答的结果直接摆在结果页上，不用回翻 */
    var chips = "";
    if (!fromHistory) {
      var chipHTML = "";
      ROUNDS.forEach(function (r, i) {
        var v = ansWithNote(answers, notes, i);
        if (!v) return;
        chipHTML += '<span class="ansChip" title="' + esc(v) + '"><b>' + esc(r.label) + '</b>' +
          esc(oneLine(v, 20)) + "</span>";
      });
      if (chipHTML) chips = '<div class="ansRow">' + chipHTML + "</div>";
    }

    var body =
      '<div class="resTop">' +
        '<span class="resMeta" id="resMeta">' + fmtNum(len) + " 字 · ~" + fmtNum(tk) + " tokens</span>" +
        speed +
      "</div>" +
      '<p class="resSub">' + steps +
        (fromHistory ? "" : " · " + esc(engineLabel) + " · 采纳 " + answered + " / " + ROUNDS.length + " 轮补充") + "</p>" +
      warning +
      chips +
      '<div class="bar"><i id="resBar"></i></div>' +
      '<div id="dimsWrap">' + dimsHTML(scored) +
        '<p class="dimNote"><b>改进建议：</b>' + esc(scored.advice.join(" ")) + "</p></div>";
    if (resultVariants.length > 1) {
      body += '<div class="variantRow" role="group" aria-label="对比版本">';
      resultVariants.forEach(function (v, i) {
        body += '<button class="variant' + (i === 0 ? " on" : "") +
                '" type="button" data-v="' + i + '" aria-pressed="' +
                (i === 0 ? "true" : "false") + '">' + esc(v.label) + "</button>";
      });
      body += "</div>";
    }
    body +=
      '<textarea class="code" id="codeOut" spellcheck="false" readonly aria-label="生成的提示词">' +
      esc(lastPrompt) + "</textarea>";

    openSheet({
      result: true,
      title: fromHistory ? "最近生成的版本" : "这次生成的结果",
      badge: lastScore + " 分",
      meta: resultVariants.length > 1
        ? resultVariants.length + " 版对比 · " + SET.detail
        : (lastGeneration.mode === "model" ? "模型 · " + lastGeneration.profileName
          : lastGeneration.mode === "fallback" ? "离线回退"
          : fromHistory ? "历史版本"
          : "离线规则") + " · " + SET.detail,
      body: body,
      footLeft: true,
      foot:
        '<button class="btn primary" id="btnCopy" type="button">复制提示词</button>' +
        '<button class="btn ghost" id="btnExport" type="button">导出 .md</button>' +
        '<button class="btn ghost" id="btnWide" type="button">全屏编辑</button>' +
        '<button class="btn ghost" id="btnUse" type="button">用这版</button>' +
        (lastGeneration.mode === "fallback" || lastGeneration.truncated
          ? '<button class="btn ghost" id="btnRetryModel" type="button" title="再向模型请求一次">重试模型</button>'
          : "") +
        '<button class="btn ghost" id="btnRegen" type="button">重新生成</button>',
      after: function () {
        requestAnimationFrame(function () {
          var b = el("resBar");
          if (b) b.style.transform = "scaleX(1)";
        });
        var variantRow = sheetBody.querySelector(".variantRow");
        if (variantRow) {
          variantRow.addEventListener("click", function (e) {
            var b = e.target.closest(".variant");
            if (!b) return;
            paintVariant(Number(b.dataset.v));
            live.textContent = "已切换到" + resultVariants[Number(b.dataset.v)].label;
          });
        }

        var out = el("codeOut");
        /* 全屏编辑后实时重算字数 / token，不再停在生成时的数字 */
        out.addEventListener("input", function () {
          var n = out.value.length;
          var meta = el("resMeta");
          if (meta) meta.textContent = fmtNum(n) + " 字 · ~" + fmtNum(Math.round(n * 1.5)) + " tokens";
          lastPrompt = out.value;
        });

        el("btnCopy").addEventListener("click", function () {
          copyText(out.value, "提示词已复制");
          flash(el("btnCopy"), "已复制");
        });

        el("btnExport").addEventListener("click", function () {
          downloadText(out.value, "提示词-" + stamp() + ".md", "text/markdown;charset=utf-8");
          toast("已导出 Markdown 文件", "ok");
        });

        el("btnWide").addEventListener("click", function () {
          var wide = sheet.classList.toggle("wide");
          out.readOnly = !wide;
          this.textContent = wide ? "退出全屏" : "全屏编辑";
          if (wide) out.focus();
          originFromOrbit();
        });

        el("btnUse").addEventListener("click", function () {
          lastPrompt = out.value;
          var rec = findHistory(currentHistoryId);
          if (rec) {
            rec.prompt = lastPrompt;
            rec.score = lastScore;
            rec.ts = Date.now();
            rec.used = true;
            persistHistory();
          } else {
            var id = addHistory({
              brief: lastBrief,
              prompt: lastPrompt,
              score: lastScore,
              engine: resultVariants[resultIdx].label || lastGeneration.profileName
            });
            markUsed(id);
            currentHistoryId = id;
          }
          copyText(lastPrompt, "已采用并复制，可在「最近」里找回");
          this.textContent = "已采用";
          this.classList.add("used");
          this.disabled = true;
          histSel = null;
          closeSheet(function () {
            resetToIdle();
            toast("已采用这一版：内容已复制，并发到「最近」里了", "ok");
          });
          live.textContent = "已采用这一版提示词";
        });

        el("btnRegen").addEventListener("click", function () {
          histSel = null;
          pendingVariants = null;
          closeSheet(function () {
            startGenerating();
          });
        });

        var retry = el("btnRetryModel");
        if (retry) {
          retry.addEventListener("click", function () {
            histSel = null;
            pendingVariants = null;
            closeSheet(function () {
              toast("重新向 " + selectedProfile().name + " 请求，超时上限 " + SET.timeout + " 秒", "ok");
              startGenerating();
            });
          });
        }
        live.textContent = "提示词已生成，" + resultVariants.length + " 个版本，" +
                           lastScore + " 分，" + len + " 字";
      }
    });

    /* 生成结果自动进历史，关掉页面也还在 */
    if (!fromHistory) {
      histSel = null;
      currentHistoryId = addHistory({
        brief: lastBrief,
        prompt: lastPrompt,
        score: lastScore,
        engine: lastGeneration.mode === "model" ? lastGeneration.profileName : "离线规则"
      });
    }
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function fallbackCopy(txt) {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }
  function flash(btn, txt) {
    var old = btn.textContent;
    btn.textContent = txt;
    window.setTimeout(function () { btn.textContent = old; }, 1400);
  }
  function downloadText(text, filename, mime) {
    var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  /* 不走第三方库，直接把 Markdown 转成 Word 能打开的 .doc（HTML+Word 命名空间） */
  function promptToWord(md) {
    var e = function (s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    };
    var body = String(md || "").split("\n").map(function (line) {
      if (/^###\s+/.test(line)) return "<h3>" + e(line.replace(/^###\s+/, "")) + "</h3>";
      if (/^##\s+/.test(line)) return "<h2>" + e(line.replace(/^##\s+/, "")) + "</h2>";
      if (/^#\s+/.test(line)) return "<h1>" + e(line.replace(/^#\s+/, "")) + "</h1>";
      if (/^\s*[-*]\s+/.test(line)) return '<p class="li">•&nbsp;' + e(line.replace(/^\s*[-*]\s+/, "")) + "</p>";
      if (/^\s*\d+\.\s+/.test(line)) return '<p class="li">' + e(line.trim()) + "</p>";
      if (!line.trim()) return "<p>&nbsp;</p>";
      return "<p>" + e(line) + "</p>";
    }).join("");
    return '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
      'xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
      '<head><meta charset="utf-8"><title>提示词</title>' +
      '<style>@page{margin:2.2cm 2cm}body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;' +
      'font-size:11pt;line-height:1.75;color:#111}h1{font-size:17pt;margin:0 0 10pt}' +
      'h2{font-size:13pt;margin:16pt 0 6pt;border-left:3px solid #4dd8e8;padding-left:8pt}' +
      'h3{font-size:11.5pt;margin:12pt 0 4pt}p{margin:3pt 0}p.li{margin:2pt 0 2pt 14pt}</style>' +
      "</head><body>" + body + "</body></html>";
  }

  function stamp() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
  }
  function fmtNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

  function oneLine(text, max) {
    var t = String(text || "").replace(/\s+/g, " ").trim().replace(/[。，,.;；]+$/, "");

  function domainOf(text) {

  /* ---- 四维评分：分数要能解释，才谈得上指导 ---- */
  function scorePrompt(prompt) {
    var t = String(prompt || "");
    var secs = (t.match(/^#\s+/gm) || []).length;
    var checks = (t.match(/^- \[ \]/gm) || []).length;
    var bullets = (t.match(/^[-*]\s+/gm) || []).length;
    var has = function (re) { return re.test(t); };
    var hasExample = has(/^#\s*输出示例/m);
    var hasSteps = has(/^#\s*执行步骤/m);
    var hasInput = has(/^#\s*输入/m);
    var hasGoal = has(/^#\s*目标/m);
    var hasDeliver = has(/^#\s*交付物/m);

    var structure = Math.min(25, Math.round(
      4 * (hasGoal ? 1 : 0) + 4 * (hasDeliver ? 1 : 0) + 3 * (hasInput ? 1 : 0) +
      3 * (hasSteps ? 1 : 0) + Math.min(11, secs * 1.4)));

    var bound = Math.min(25, Math.round(
      9 + bullets * 1.05 + (has(/^#\s*(禁区|边界)/m) ? 4 : 0)));

    var accept = Math.min(25, Math.round(8 + checks * 3.2));

    var exec = Math.min(25, Math.round(
      (hasSteps ? 6 : 0) + (hasExample ? 5 : 0) + (hasInput ? 4 : 0) +
      (t.length >= 420 ? 6 : 3) + (has(/必须|禁止|不得|写死|逐条/) ? 4 : 0)));

    var total = Math.max(40, Math.min(98, structure + bound + accept + exec));
    var dims = [
      { k: "结构", v: structure, max: 25, note: secs + " 个章节" + (hasGoal && hasDeliver ? "，目标与交付物齐全" : "，缺少目标或交付物") },
      { k: "约束", v: bound, max: 25, note: bullets + " 条可执行约束" + (has(/^#\s*(禁区|边界)/m) ? "，含禁区" : "") },
      { k: "验收", v: accept, max: 25, note: checks ? checks + " 条可勾选标准" : "还没有可勾选的验收项" },
      { k: "可执行", v: exec, max: 25, note: (hasSteps ? "有执行步骤" : "缺执行步骤") + (hasExample ? "，带示例" : "") + "，" + t.length + " 字" }
    ];

    var advice = [];
    if (checks < 3) advice.push("验收项太少，补成可逐条打勾的清单，执行方才能自己判断做没做对。");
    if (!hasExample) advice.push("补一段「输入 → 输出」示例，能显著减少理解偏差。");
    if (bullets < 8) advice.push("约束偏少，把「别做什么」也写下来，比只写「要做什么」更管用。");
    if (t.length < 420) advice.push("篇幅偏短，关键参数（字段、阈值、边界）可能还没写死。");
    if (!advice.length) advice.push("结构与约束已经完整，建议补一条「失败时怎么办」的处理约定。");

    return { total: total, dims: dims, advice: advice.slice(0, 2) };
  }

  function scoreOf(brief, ans, st) {
    return scorePrompt(composePrompt(brief, ans, st)).total;
  }

  /* ================= 发射 ================= */
  var busy = false;
  function shoot() {
    if (busy || state !== ST_IDLE) return;
    var text = input.value.trim();
    if (!text) return;

    busy = true;
    lastBrief = text;
    answers = [];
    notes = [];
    roundIdx = 0;

    var p0 = centerOf(sendBtn), p2 = orbitCenter();
    var ctx = { p0: p0, p2: p2, bulge: bulgeOf(p0, p2) };

    input.blur();
    hideComposer();
    state = ST_FLY;

    pool.ball.style.opacity = "1";
    pool.ballSvg.style.transform = "rotate(0deg)";
    pool.chip.textContent = text.length > 18 ? text.slice(0, 18) + "…" : text;
    pool.chip.style.opacity = "0";
    for (var k = 0; k < N_GHOST; k++) pool.ghosts[k].style.opacity = "0";
    put(pool.ball, p0.x, p0.y, 1.06);

    live.textContent = "已发射：" + text;

    if (reducedMotion()) { reducedShot(ctx); return; }

    var last = 0, acc = 0;
    function press(now) {
      if (!last) last = now;
      var dt = now - last; last = now;
      if (dt < 0) dt = 0;
      if (dt > DT_MAX) dt = DT_MAX;
      acc += dt;
      var t = acc >= TAP_MS ? 1 : acc / TAP_MS;
      var d = Math.sin(Math.PI * t);
      put(pool.ball, p0.x, p0.y, 1.06 + 0.09 * d);
      chipAt(p0.x, p0.y);
      pool.chip.style.opacity = String(0.9 - 0.4 * d);
      if (t < 1) { requestAnimationFrame(press); return; }
      flyOff(ctx);
    }
    requestAnimationFrame(press);
  }

  function flyOff(ctx) {
    var p0 = ctx.p0, p2 = ctx.p2, b = ctx.bulge;
    var pt = { x: p0.x, y: p0.y }, gp = { x: 0, y: 0 };
    var dotClock = TRAIL_EVERY;

    tween(FLY_MS, function (t, dt) {
      pathAt(p0, p2, b, t, pt);
      put(pool.ball, pt.x, pt.y, 1.06 - 0.22 * t, t * 250);
      chipAt(pt.x, pt.y);
      pool.chip.style.opacity = String(Math.max(0, Math.min(1, (1 - t) * 1.9)));

      for (var k = 0; k < N_GHOST; k++) {
        var g = pool.ghosts[k], ek = t - GHOST_LAG[k];
        if (ek <= 0) { g.style.opacity = "0"; continue; }
        pathAt(p0, p2, b, ek, gp);
        put(g, gp.x, gp.y, (1.06 - 0.22 * ek) * (1 - 0.07 * k));
        g.style.opacity = String(GHOST_ALPHA[k] * (0.35 + 0.65 * (1 - t)) * (1 - t * t * t));
      }
      if (t < TRAIL_TILL) {
        dotClock += dt;
        while (dotClock >= TRAIL_EVERY) { dotClock -= TRAIL_EVERY; emitDot(pt.x, pt.y); }
      }
    }, function () {
      dropThrough(ctx);
    });
  }

  function dropThrough(ctx) {
    var p2 = ctx.p2;
    var direct = SET.flow === "直接生成";
    landFx(p2);

    tween(HIT_MS, function (t) {
      /* 直接生成：停在轨道中心不消失，接着入轨；先沟通：缩一下隐去，弹窗从这点长出来 */
      put(pool.ball, p2.x, p2.y, 0.86 + 0.14 * t);
      if (!direct) pool.ball.style.opacity = String(t > 0.55 ? Math.max(0, (1 - t) / 0.45) : 1);
      chipAt(p2.x, p2.y);
      pool.chip.style.opacity = String(Math.max(0, 1 - t * 1.6));
    }, function () {
      pool.chip.style.opacity = "0";
      busy = false;
      if (direct) startGenerating();
      else { reclaim(); openAsk(); }
    });
  }

  function reducedShot(ctx) {
    put(pool.ball, ctx.p0.x, ctx.p0.y, 1);
    pool.ball.style.opacity = "1";
    chipAt(ctx.p0.x, ctx.p0.y);
    pool.chip.style.opacity = "0";
    tween(REDUCED_MS, function (t) {
      pool.ball.style.opacity = String(1 - t);
    }, function () {
      reclaim();
      busy = false;
      if (SET.flow === "直接生成") startGenerating();
      else openAsk();
    });
  }

  /* ================= 回到待机 ================= */
  function resetToIdle() {
    orbitStop("abort");
    busy = false;
    state = ST_IDLE;
    answers = [];
    notes = [];
    roundIdx = 0;
    input.value = "";
    input.disabled = false;
    showComposer();
    syncSend();
    updateModeStatus();
    window.setTimeout(function () {
      requestAnimationFrame(function () {
        fitOrbit();
        try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
      });
    }, 260);
  }
  function resetAll() {
    closeSheet(resetToIdle);
  }

  /* ================= 事件 ================= */
  input.addEventListener("input", function () { syncSend(); });
  input.addEventListener("focus", function () { composer.classList.add("focus"); });
  input.addEventListener("blur", function () { composer.classList.remove("focus"); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); shoot(); }
  });
  sendBtn.addEventListener("click", function () { input.focus(); shoot(); });
  addModelBtn.addEventListener("click", openModelDialog);

  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && (e.key === "/" || e.key === "?")) {
      e.preventDefault();
      if (state === ST_IDLE) {
        if (panelOpen === "feats") closePanel(); else openPanel("feats");
      }
      return;
    }
    if (panelOpen && e.key === "Escape") {
      e.preventDefault();
      closePanel(true);
    }
  });

  document.addEventListener("pointerdown", function (e) {
    if (panelOpen && !composer.contains(e.target)) closePanel();
  });

  orbitCancel.addEventListener("click", function () {
    if (state !== ST_GEN) return;
    genCancelAt = Date.now();
    abortActiveCall("已取消等待");
    orbitStop("abort");
    toast("已取消模型请求，立刻用离线规则出稿", "warn");
  });

  /* 生成中按 Esc：不再干等模型，立刻用离线规则出稿 */
  document.addEventListener("keydown", function (e) {
    if (state !== ST_GEN) return;
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    e.preventDefault();
    genCancelAt = Date.now();
    abortActiveCall("已取消等待");
    orbitStop("abort");
    toast("已取消模型请求，立刻用离线规则出稿", "warn");
  });

  sheetClose.addEventListener("click", function () {
    if (Date.now() - sheetOpenedAt < 350) return;
    if (sheetKind === "model") { closeModelDialog(); return; }
    if (state === ST_ASK) { submitRound(false); return; }
    resetAll();
  });

  scrim.addEventListener("click", function () {
    if (Date.now() - sheetOpenedAt < 400) return;
    if (sheetKind === "model") { closeModelDialog(); return; }
    if (state === ST_ASK) { submitRound(false); return; }
    resetAll();
  });

  document.addEventListener("keydown", function (e) {
    if (sheet.hidden) return;
    var esc = e.key === "Escape" || e.keyCode === 27;
    if (!esc) return;
    if (Date.now() - sheetOpenedAt < 350) return;
    e.preventDefault();
    if (sheetKind === "model") { closeModelDialog(); return; }
    if (state === ST_ASK) { submitRound(false); return; }
    resetAll();
  });

  document.addEventListener("keydown", function (e) {
    if (sheet.hidden || e.key !== "Tab") return;
    var nodes = sheet.querySelectorAll("button, [href], textarea, input, select, [tabindex]");
    var list = [];
    for (var i = 0; i < nodes.length; i++) {
      if (!nodes[i].disabled && nodes[i].offsetParent !== null) list.push(nodes[i]);
    }
    if (!list.length) return;
    var first = list[0], last = list[list.length - 1], act = document.activeElement;
    var inside = sheet.contains(act);
    if (e.shiftKey) { if (!inside || act === first) { e.preventDefault(); last.focus(); } }
    else { if (!inside || act === last) { e.preventDefault(); first.focus(); } }
  });

  document.addEventListener("keydown", function (e) {
    if (state !== ST_IDLE || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!sheet.hidden) return;
    if (document.activeElement === input) return;
    /* 空格是按钮 / 开关的原生激活键（Chrome 在 keyup 上触发 click）。
       如果这里把焦点抢到输入框，keyup 就落到输入框上，按钮永远等不到 click，
       键盘用户按空格点不动任何东西。所以空格一律不抢；
       焦点已经停在可交互控件上时，同样不该把焦点拽走。 */
    if (e.key === " " || e.key === "Spacebar" || e.keyCode === 32) return;
    var act = document.activeElement;
    if (act && act.closest && act.closest("button, a[href], input, select, textarea, summary, [tabindex], [contenteditable='true']")) return;
    if (e.key && e.key.length === 1) input.focus();
  });

  window.addEventListener("resize", function () {
    if (window.__pwQueued) return;
    window.__pwQueued = true;
    requestAnimationFrame(function () {
      window.__pwQueued = false;
      fitOrbit();
      if (!sheet.hidden) originFromOrbit();
      if (panelOpen) fitPanel();
    });
  });

  /* ================= 初始化 ================= */
  buildPool();
  refreshCaps();
  fitOrbit();
  syncSend();
  renderHistoryBadge();
  if (panel) panel.setAttribute("inert", "");
  panelBody.addEventListener("scroll", function () {
    var bottom = panelBody.scrollHeight - panelBody.scrollTop - panelBody.clientHeight;
    panel.classList.toggle("scrollable", bottom > 8);
  });
  (function restoreSelection() {
    var savedKey = "";
    try { savedKey = localStorage.getItem("pw-selected-profile") || ""; } catch (e) {}
    if (savedKey && allModelProfiles().some(function (p) { return p.key === savedKey; })) {
      setSelectedProfile(savedKey, false);
    } else {
      updateModeStatus();
    }
  })();
  loadServerProfiles();
  window.addEventListener("load", fitOrbit);
})();
</script>
</body>
</html>
